# 头目：二选一必掉
bosses:
  forge:   {pick_one: [forge_king_hammer, forge_heart]}
  crystal: {pick_one: [mother_heart, prism_scepter], extra: [{item: crystal_dust, chance: 1.0}]}
  silent:  {pick_one: [soundless_bell, high_priest_staff], extra: [{item: silence_incense, chance: 0.5}]}
  desert:  {pick_one: [pharaoh_mask, pharaoh_flail], extra: [{item: mural_rubbing, chance: 0.5}]}
  dream:   {pick_one: [crown_of_unwaking, memory_blade]}
  fog:     {pick_one: [ferryman_oar, ferryman_lamp], extra: [{item: ship_plaque, chance: 0.5}]}
  astral:  {pick_one: [star_astrolabe, meteor_maul], extra: [{item: stardust, chance: 1.0}]}

# 第 25、50、75……层的关卡头目：二选一必掉，另一件 20% 几率一起掉；另外必掉三颗宝石
gate_bosses:
  upon_mountain: {pick_one: [jackal_scepter, golden_scale], other_chance: 0.2, gems: 3}
  perseus:       {pick_one: [helm_of_hades, winged_sandals], other_chance: 0.2, gems: 3}

