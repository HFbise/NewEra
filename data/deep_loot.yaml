# 宝石池（合并进 gems.pools）
gems:
  pools:
    forge:   [bloodstone, sunder_stone, ironheart_stone]    # 这里的怪不怕火，余烬石没用
    crystal: [keen_ink, glowstone, inkward_opal, prism_shard]
    silent:  [cats_eye, inkward_opal, frost_jade]
    desert:  [mossvein_stone, rootbind_stone, ember_stone, staunch_stone]
    dream:   [keen_ink, vigor_garnet, cats_eye]
    fog:     [black_pearl, staunch_stone, rootbind_stone]
    astral:  [bloodstone, sunder_stone, keen_ink, glowstone]
  # 水晶洞窟是宝石主题：普通怪、精英、宝箱房的宝石掉率再 ×2（叠在 deep_mult 上）
  theme_mult: {crystal: 2}
