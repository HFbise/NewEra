# Render 部署配置：在 Render 后台 New > Blueprint，选这个 GitHub 仓库就会按这里建服务
services:
  - type: web
    name: newera
    runtime: python
    region: oregon          # 和 Supabase（us-west-2）挨得近，数据库往返快
    plan: free              # 免费档：15 分钟没人访问会休眠，再打开要等半分钟到一分钟
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      # sync: false 的变量在创建时会让你在后台填，不会写进仓库
      - key: DATABASE_URL
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: zhipu
      # 2026-09-23 换回 glm-4.7-flash 试角色扮演效果（之前排队 30 到 100 秒，最近平均 5 秒左右，偶尔失败）
      - key: AI_MODEL
        value: glm-4.7-flash
      # 主模型限流、超时时按顺序换这些再试（4.5 秒回但扮演弱些，4-flash 叙事差些但基本不排队）
      - key: AI_FALLBACK_MODEL
        value: glm-4.5-flash
      - key: PARSE_MODE
        value: rules
      # 需要邀请码时在后台加一个 ACCESS_CODE 环境变量，登录页会自动出现邀请码输入框
