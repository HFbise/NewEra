<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewEra 新世纪</title>
<style>
  :root {
    --bg: #15171c; --panel: #1d2027; --border: #2c313b; --text: #d8dce4; --dim: #8a92a0;
    --accent: #7fb3ff; --ok: #8fd18f; --bad: #ff8a80; --you: #e6c07b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 300px; height: 100vh; }
  #main { display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .entry { margin-bottom: 14px; }
  .you { color: var(--you); }
  .parsed { color: var(--dim); font: 12px/1.4 ui-monospace, Consolas, monospace; margin: 2px 0 4px; }
  .fact { padding-left: 14px; border-left: 2px solid var(--ok); margin: 2px 0; }
  .fact.fail { border-color: var(--bad); color: var(--bad); }
  .sys { color: var(--dim); }
  .narrative { white-space: pre-wrap; margin: 4px 0; }
  details { color: var(--dim); font-size: 13px; }
  summary { cursor: pointer; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: #0d1117; border: 0; border-radius: 6px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  #side { background: var(--panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; }
  #side h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 18px 0 6px; }
  #side h2:first-child { margin-top: 0; }
  #side .room { font-size: 18px; font-weight: 700; }
  #side ul { list-style: none; padding: 0; margin: 0; }
  #side li { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
  #side li:hover { background: var(--border); }
  .ref { color: var(--dim); font: 12px ui-monospace, Consolas, monospace; margin-right: 6px; }
  .tag { color: var(--dim); font-size: 12px; margin-left: 4px; }
  .hp { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .hp div { height: 100%; background: var(--ok); }
  #help { color: var(--dim); font-size: 12px; line-height: 1.7; }
  #login { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  #login form { border: 1px solid var(--border); border-radius: 8px; flex-direction: column; width: 300px; padding: 20px; }
  #login button { padding: 10px; }
  @media (max-width: 720px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    #side { border-left: 0; border-top: 1px solid var(--border); max-height: 40vh; }
  }
</style>
</head>
<body>
<div id="login">
  <form id="login-form">
    <div>输入角色名（没有就新建）</div>
    <input id="login-name" maxlength="20" autofocus>
    <button>进入</button>
  </form>
</div>

<div id="app">
  <div id="main">
    <div id="log"></div>
    <form id="cmd-form">
      <input id="cmd" autocomplete="off" placeholder="比如：拿面包；北；对老汉斯说 你好">
      <button>发送</button>
    </form>
  </div>
  <aside id="side"></aside>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let playerId = null;
try { playerId = localStorage.getItem("newera.player"); } catch {}

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  } : undefined);
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function log(html) {
  const div = document.createElement("div");
  div.className = "entry";
  div.innerHTML = html;
  $("#log").append(div);
  $("#log").scrollTop = $("#log").scrollHeight;
}

function render(s) {
  const p = s.player;
  const li = (ref, label, extra = "") =>
    `<li data-name="${esc(label)}"><span class="ref">${ref}</span>${esc(label)}${extra}</li>`;
  $("#side").innerHTML = `
    <h2>${esc(p.name)}</h2>
    <div>HP ${p.hp}/${p.max_hp} · 攻 ${p.attack} · 防 ${p.defense}</div>
    <div class="hp"><div style="width:${100 * p.hp / p.max_hp}%"></div></div>
    ${Object.keys(p.flags).length ? `<div class="tag">标记：${Object.keys(p.flags).map(esc).join("、")}</div>` : ""}
    <h2>位置</h2>
    <div class="room">${esc(s.room.name)}</div>
    <div class="sys">${esc(s.room.description)}</div>
    <h2>出口</h2>
    <ul>${s.exits.map(e => `<li data-name="${e.label}">${e.label}${e.locked ? '<span class="tag">锁着</span>' : ""}</li>`).join("")}</ul>
    ${s.npcs.length ? `<h2>NPC</h2><ul>${s.npcs.map(n => li(n.ref, n.name,
      n.max_hp ? `<span class="tag">${n.hp}/${n.max_hp}</span>` : "")).join("")}</ul>` : ""}
    ${s.others.length ? `<h2>其他玩家</h2><ul>${s.others.map(o => `<li>${esc(o.name)}<span class="tag">${o.awake ? "HP " + o.hp : "睡着了"}</span></li>`).join("")}</ul>` : ""}
    ${s.items.length ? `<h2>地上</h2><ul>${s.items.map(i => li(i.ref, i.name,
      i.quantity > 1 ? `<span class="tag">x${i.quantity}</span>` : "")).join("")}</ul>` : ""}
    <h2>背包</h2>
    <ul>${s.inventory.map(i => li(i.ref, i.name,
      (i.quantity > 1 ? `<span class="tag">x${i.quantity}</span>` : "") +
      (i.equipped ? `<span class="tag">[${i.equipped === "weapon" ? "武器" : "护甲"}]</span>` : ""))).join("") || '<li class="sys">空</li>'}</ul>
    <h2>命令</h2>
    <div id="help">
      看 / 看 哥布林 / 看 北<br>
      北 南 东 西 上 下（或 n s e w u d）<br>
      拿面包 · 扔面包 · 装备短剑 · 吃药草<br>
      打哥布林 · 开下面的门 · 用钥匙 下<br>
      对老汉斯说 你好 · 把面包给老汉斯<br>
      用 ; 分隔多个命令，其他输入算 自由行动<br>
      点侧栏里的名字会填进输入框
    </div>
    <h2></h2>
    <a href="#" id="logout" class="sys">换角色</a>　<a href="#" id="delete" class="sys">删除角色</a>`;
}

// 进入游戏时显示所在位置：只读状态，不发命令，不调 AI
async function enter() {
  try {
    const s = await api(`/api/state?player_id=${playerId}`);
    render(s);
    const list = (label, arr) => arr.length ? `<div>${label}：${arr.map(esc).join("、")}</div>` : "";
    log(`<div class="sys"><b>${esc(s.room.name)}</b>　${esc(s.room.description)}` +
      list("出口", s.exits.map(e => e.label + (e.locked ? "（锁着）" : ""))) +
      list("这里有", s.npcs.map(n => n.name)) +
      list("地上有", s.items.map(i => i.name)) +
      list("其他玩家", s.others.map(o => o.name + (o.awake ? "" : "（睡着了）"))) + `</div>`);
  } catch (e) { logout(); }
}

async function refresh() {
  if (!playerId) return;
  try { render(await api(`/api/state?player_id=${playerId}`)); }
  catch (e) { logout(); }
}

async function deleteCharacter() {
  const name = document.querySelector("#side h2")?.textContent || "这个角色";
  if (!confirm(`确定删除「${name}」？删了就没了，身上的东西会掉在原地。`)) return;
  try {
    await api("/api/delete", { player_id: playerId });
    playerId = null;
    try { localStorage.removeItem("newera.player"); } catch {}
    $("#log").innerHTML = "";
    $("#login").style.display = "flex";
  } catch (err) { alert(err.message); }
}

function logout() {
  // 角色留在原地睡着，别人能看到
  if (playerId) fetch("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify({ player_id: playerId }) }).catch(() => {});
  playerId = null;
  try { localStorage.removeItem("newera.player"); } catch {}
  $("#login").style.display = "flex";
}

$("#login-form").onsubmit = async e => {
  e.preventDefault();
  try {
    const { player_id } = await api("/api/login", { name: $("#login-name").value });
    playerId = player_id;
    try { localStorage.setItem("newera.player", playerId); } catch {}
    $("#login").style.display = "none";
    $("#log").innerHTML = "";
    await enter();
    $("#cmd").focus();
  } catch (err) { alert(err.message); }
};

async function send(text) {
  log(`<div class="you">&gt; ${esc(text)}</div>`);
  try {
    const d = await api("/api/command", { player_id: playerId, text });
    const parsed = d.actions.map(a => JSON.stringify(a)).join("  ");
    const cost = d.usage.input || d.usage.output ? ` · token ${d.usage.input} 入 / ${d.usage.output} 出` : "";
    const facts = d.results.map(r =>
      r.facts.map(f => `<div class="fact${r.success ? "" : " fail"}">${esc(f)}</div>`).join("")).join("");
    log(`<div class="parsed">[${d.source === "ai" ? "AI 解析" : "规则解析"}${cost}] ${esc(parsed)}</div>` +
      (d.narrative ? `<div class="narrative">${esc(d.narrative)}</div><details><summary>facts</summary>${facts}</details>` : facts) +
      d.notes.map(n => `<div class="sys">${esc(n)}</div>`).join(""));
    render(d.state);
  } catch (err) {
    log(`<div class="fact fail">${esc(err.message)}</div>`);
  }
}

$("#cmd-form").onsubmit = e => {
  e.preventDefault();
  const text = $("#cmd").value.trim();
  if (!text) return;
  $("#cmd").value = "";
  send(text);
};

$("#side").onclick = e => {
  if (e.target.id === "logout") { e.preventDefault(); logout(); return; }
  if (e.target.id === "delete") { e.preventDefault(); deleteCharacter(); return; }
  const li = e.target.closest("li[data-name]");
  if (li) { $("#cmd").value += li.dataset.name; $("#cmd").focus(); }
};

if (playerId) { $("#login").style.display = "none"; enter(); }
setInterval(refresh, 3000);   // 没有 WebSocket，先轮询看其他玩家的变化
</script>
</body>
</html>
