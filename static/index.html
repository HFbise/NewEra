<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NewEra 新世纪</title>
<style>
  :root {
    --bg: #15171c; --panel: #1d2027; --border: #2c313b; --text: #d8dce4; --dim: #8a92a0;
    --accent: #7fb3ff; --ok: #8fd18f; --bad: #ff8a80; --you: #e6c07b; --other: #c3a6ee;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
  /* dvh 是去掉手机浏览器地址栏后的可见高度，不支持的浏览器退回 vh；
     minmax(0, 1fr) 和 min-height: 0 让长内容在聊天框里面滚动、换行，不把整页撑大 */
  #app { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: 100vh; height: 100dvh; }
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px 20px; overflow-wrap: anywhere; }
  .entry { margin-bottom: 14px; }
  .you { color: var(--you); }
  .parsed { color: var(--dim); font: 12px/1.4 ui-monospace, Consolas, monospace; margin: 2px 0 4px; }
  .fact { padding-left: 14px; border-left: 2px solid var(--ok); margin: 2px 0; }
  .fact.fail { border-color: var(--bad); color: var(--bad); }
  .sys { color: var(--dim); }
  .narrative { white-space: pre-wrap; margin: 4px 0; }
  .pending { color: var(--dim); font-size: 13px; }
  .other { color: var(--other); white-space: pre-wrap; }   /* 别人跟 NPC 的对话是两三行 */
  /* 战斗回合：结算（每个人出手的结果、敌人的行动）和整队共用的叙事 */
  .round { border-left: 2px solid #e3b341; padding-left: 12px; font-size: 14px; }
  .round-story { white-space: pre-wrap; margin: 4px 0; }
  /* 地牢小地图：3×3 格子，格子之间有门就画连线；走过的亮、显出来没走过的暗、没去过的空着；现在所在的高亮 */
  #side .minimap { display: grid; grid-template-columns: repeat(5, auto); justify-content: start; align-items: center;
                   margin: 8px 0 4px; }
  #side .minimap .c { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 4px; display: flex;
                      align-items: center; justify-content: center; font-size: 12px; color: var(--dim); position: relative; }
  #side .minimap .c.walked { background: var(--border); color: var(--text); }
  #side .minimap .c.known { border-style: dashed; }
  #side .minimap .c.here { border: 2px solid var(--accent); color: var(--accent); font-weight: 700; }
  #side .minimap .c.none { border-color: transparent; }
  #side .minimap .h { width: 10px; height: 2px; }
  #side .minimap .v { width: 2px; height: 10px; justify-self: center; }
  #side .minimap .h.on, #side .minimap .v.on { background: var(--dim); }
  #side .minimap .door { position: absolute; font-size: 9px; color: #e3b341; }
  #side .combat { margin-top: 8px; padding: 8px 10px; border: 1px solid #e3b341; border-radius: 6px; font-size: 13px; }
  #side .combat b { color: #e3b341; }
  details { color: var(--dim); font-size: 13px; }
  summary { cursor: pointer; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: #0d1117; border: 0; border-radius: 6px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  #side { background: var(--panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto;
          min-height: 0; overflow-wrap: anywhere; }
  #grip { display: none; }            /* 拖动条只在窄屏用 */
  #side h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 18px 0 6px; }
  #side h2:first-child { margin-top: 0; }
  #side .room { font-size: 18px; font-weight: 700; }
  #side ul { list-style: none; padding: 0; margin: 0; }
  #side li { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
  #side li:hover { background: var(--border); }
  .ref { color: var(--dim); font: 12px ui-monospace, Consolas, monospace; margin-right: 6px; }
  .tag { color: var(--dim); font-size: 12px; margin-left: 4px; }
  .hp { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .hp div { height: 100%; background: var(--ok); }
  #help { color: var(--dim); font-size: 12px; line-height: 1.7; }
  /* 装备栏两列，格子名在前；空格子不能点 */
  #side ul.equip { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  /* 能收起的栏目：做成按钮的样子，一看就知道能点 */
  /* 地牢里的光亮：条上的竖线是 50，低于它命中开始打折 */
  #side .light { margin-top: 8px; font-size: 13px; }
  #side .lightbar { position: relative; height: 6px; background: var(--border); border-radius: 3px; margin: 4px 0; }
  #side .lightbar div { height: 100%; background: #e3b341; border-radius: 3px; }
  #side .lightbar .mark { position: absolute; left: 50%; top: -2px; width: 1px; height: 10px; background: var(--dim); }
  #side .light ul.sys li { padding: 1px 0; cursor: default; }
  #side .light ul.sys li:hover { background: none; }
  #side h2.fold { cursor: pointer; user-select: none; display: inline-block; padding: 3px 12px;
                  border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
  #side h2.fold:hover { border-color: var(--accent); }
  #side h2.fold::after { content: " ▾ 收起"; color: var(--dim); font-weight: 400; }
  #side h2.fold.closed::after { content: " ▸ 展开"; }
  #side .fold + .fold-body { margin-top: 6px; }
  #side .closed + .fold-body { display: none; }
  #side ul.equip li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #side ul.equip li.empty { color: var(--dim); cursor: default; }
  #side ul.equip li.empty:hover { background: none; }
  .tag.slot { margin: 0 6px 0 0; }
  /* 点物品、技能、光亮弹出详情小窗，按"输入"才填进输入框 */
  #tip { position: fixed; left: 12px; right: 12px; z-index: 10; max-width: 420px; margin: 0 auto; background: var(--panel);
         border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, .5);
         font-size: 14px; }
  #tip .name { font-weight: 700; margin-bottom: 4px; }
  #tip .detail { white-space: pre-wrap; color: var(--text); }
  #tip .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  #tip button { padding: 6px 16px; }
  #tip button.close { background: var(--border); color: var(--text); }
  #login { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  #login form { border: 1px solid var(--border); border-radius: 8px; flex-direction: column; width: 300px; padding: 20px; }
  #login button { padding: 10px; }
  /* 窄屏：信息栏放到下面，聊天框和输入框在上面，信息栏最多占 40% 屏高、自己滚动 */
  @media (max-width: 720px) {
    #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    /* 信息栏高度默认 40%，拖输入框上沿的拖动条可以调（--side-h，记在本机），拖到底就收起 */
    #side { border-left: 0; border-top: 1px solid var(--border); height: var(--side-h, 40vh); height: var(--side-h, 40dvh);
            padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    body.side-hidden #side { display: none; }
    #log { padding: 12px; }
    #cmd-form { position: relative; padding: 14px 10px 8px; touch-action: none; }   /* 拖的时候别让浏览器当成滚动 */
    #cmd-form input, #cmd-form button { touch-action: manipulation; }
    #grip { display: block; position: absolute; top: 0; left: 0; right: 0; height: 14px; cursor: row-resize; }
    #grip::after { content: ""; position: absolute; top: 5px; left: 50%; width: 36px; height: 4px; margin-left: -18px;
                   border-radius: 2px; background: var(--border); }
    body.dragging #grip::after { background: var(--accent); }
    body.dragging { user-select: none; }
    input { font-size: 16px; }                 /* 小于 16px 时 iPhone 聚焦输入框会自动放大页面 */
    #login form { width: auto; max-width: 300px; margin: 0 16px; }
  }
</style>
</head>
<body>
<div id="login">
  <form id="login-form">
    <div>角色名（没有就新建）</div>
    <input id="login-name" maxlength="20" autofocus autocomplete="username">
    <div>密码（新角色在这里设置，至少 4 位）</div>
    <input id="login-password" type="password" autocomplete="current-password">
    <div class="code-field" hidden>邀请码</div>
    <input id="login-code" class="code-field" autocomplete="off" hidden>
    <button>进入</button>
  </form>
</div>

<div id="app">
  <div id="main">
    <div id="log"></div>
    <form id="cmd-form">
      <div id="grip" title="上下拖动调整信息栏高度"></div>
      <input id="cmd" autocomplete="off" placeholder="比如：拿面包；北；对麦琪 来杯黑啤">
      <button>发送</button>
    </form>
  </div>
  <aside id="side"></aside>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let playerId = null;
let lastEventId = null;             // 已经看过的最后一条房间动态
const shownEvents = new Set();      // 轮询和命令结果可能带回同一条，去重
try { playerId = localStorage.getItem("newera.player"); } catch {}
// 邀请码记在本机，下次不用再填
try { document.getElementById("login-code").value = localStorage.getItem("newera.code") || ""; } catch {}
// 服务器设了邀请码才显示输入框
fetch("/api/config").then(r => r.json()).then(c => {
  document.querySelectorAll(".code-field").forEach(el => { el.hidden = !c.access_code; });
}).catch(() => {});

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  } : undefined);
  // 部署重启时 Render 会回一页 HTML，解析不了也当连接问题处理
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.detail || res.statusText), { status: res.status });
  return data;
}

function log(html) {
  const div = document.createElement("div");
  div.className = "entry";
  div.innerHTML = html;
  $("#log").append(div);
  $("#log").scrollTop = $("#log").scrollHeight;
}

// 装备、技能栏可以点标题收起，收没收记在本机（轮询重画时照着记的状态画）
let folded = new Set();
try { folded = new Set(JSON.parse(localStorage.getItem("newera.folded") || "[]")); } catch {}
const foldHead = (key, title) => `<h2 class="fold${folded.has(key) ? " closed" : ""}" data-fold="${key}">${title}</h2>`;

function render(s) {
  const p = s.player;
  // fill 是点一下填进输入框的文字，默认就是名字
  const li = (ref, label, extra = "", fill = label, detail = "") =>
    `<li data-name="${esc(fill)}"${detail ? ` data-detail="${esc(detail)}"` : ""}><span class="ref">${ref}</span>${esc(label)}${extra}</li>`;
  $("#side").innerHTML = `
    <h2>${esc(p.name)}</h2>
    <div>HP ${p.hp}/${p.max_hp} · 攻 ${s.attack_total} · 防 ${s.defense_total} · 金币 ${p.gold}</div>
    <div class="hp"><div style="width:${100 * p.hp / p.max_hp}%"></div></div>
    ${p.hp <= 0 ? `<div class="sys">你倒下了，只能看和说话，等别人来急救；或者输入“复活”被抬回酒馆（“回铁匠铺复活”去莉娜那）</div>` : ""}
    ${s.stealth ? `<div class="sys">${esc(s.stealth)}</div>` : ""}
    ${p.status ? `<div class="sys">你${esc(p.status.label)}，${p.status.kind === "incapacitated" ? "说什么都算挣扎着醒来" : p.status.kind === "prone" ? "输入“站起来”爬起来" : "动不了，试试挣脱"}</div>` : ""}
    ${(p.effects || []).map(e => e.kind === "whet" ? `<div class="sys">磨利：普通攻击伤害 +${e.value}（这一层）</div>` :
      e.kind === "cheer" ? `<div class="sys">浑身是劲（回头见❤）：攻击 +${e.value}%（还剩 ${e.left} 层）</div>` : `<div class="sys">${{poison: "中毒", bleed: "流血", blind: "看不清", corrode: "腐蚀"}[e.kind]}：${esc(e.label)}（还剩 ${e.left} ${e.kind === "bleed" ? "个动作" : "回合"}）</div>`).join("")}
    ${Object.keys(p.flags).length ? `<div class="tag">标记：${Object.keys(p.flags).map(esc).join("、")}</div>` : ""}
    ${s.combat ? `<div class="combat"><b>⚔ 战斗中 · 第 ${s.combat.round} 轮</b>${s.combat.resolving ? " · 结算中…" : ""}
      <div>已出手：${s.combat.acted.map(esc).join("、") || "还没人"}</div>
      <div class="sys">${s.combat.waiting.length ? "在等：" + s.combat.waiting.map(esc).join("、") : "全队都出手了"}</div>
      <div class="sys">全队都出完手才一起结算（掉线的人不等）</div></div>` : ""}
    <h2>位置</h2>
    <div class="room">${esc(s.room.name)}</div>
    <div class="sys">${esc(s.room.description)}</div>
    ${s.minimap ? minimapHtml(s.minimap) : ""}
    ${s.room.props && s.room.props.stone ? `<div class="combat">这里有传送石：说“回城”回到地面；到过这里的人，以后在地窖里说“传送到第 N 层”（对石碑说也行）就能直接回来</div>` : ""}
    ${s.light ? `<div class="light">光亮 ${s.light.value}/100 · ${esc(s.light.word)}
      <div class="lightbar"><div style="width:${s.light.value}%"></div><span class="mark"></span></div>
      <ul class="sys">${s.light.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
      <div class="tag">光从哪来：${esc(s.light.source)}</div></div>` : ""}
    <h2>出口</h2>
    <ul>${s.exits.map(e => `<li data-name="${e.label}">${e.label}<span class="tag">${esc(e.to)}${e.locked ? "（锁着）" : ""}</span></li>`).join("")}</ul>
    ${s.npcs.length ? `<h2>NPC</h2><ul>${s.npcs.map(n => li(n.ref, n.name,
      (n.max_hp ? `<span class="tag">${n.hp}/${n.max_hp}</span>` : "") +
      (n.beast ? `<span class="tag">野兽·可安抚</span>` : "") +
      (n.status ? `<span class="tag">${esc(n.status)}</span>` : ""), n.fill || `对${n.name} `, n.detail)).join("")}</ul>` : ""}
    ${s.others.length ? `<h2>其他玩家</h2><ul>${s.others.map(o => o.hp <= 0
      ? `<li data-name="对${esc(o.name)} ">${esc(o.name)}<span class="tag">倒下了</span></li>`
      : `<li data-name="对${esc(o.name)} ">${esc(o.name)}<span class="tag">${o.status ? esc(o.status) : o.awake ? "HP " + o.hp : "睡着了"}</span></li>`).join("")}</ul>` : ""}
    ${s.following ? `<div class="sys">正跟着${esc(s.following)}（输入"停止跟随"不跟了）</div>` : ""}
    ${s.party.length ? `<h2>队伍</h2><ul>${s.party.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
    ${s.duel ? `<h2>决斗</h2><div class="sys">正和${esc(s.duel.opponent)}决斗，相隔 ${s.duel.distance} 格。${s.duel.challenger
      ? "你是发起者，要离开得先输入“逃跑”并成功" : "你是被挑战的一方，随时可以走开，走开决斗就结束"}</div>` : ""}
    ${s.challenges.length ? `<h2>决斗申请</h2><ul>${s.challenges.map(n => `<li data-name="接受${esc(n)}的决斗">${esc(n)}<span class="tag">向你申请决斗</span></li>`).join("")}</ul>
      <div class="sys">${esc(s.duel_rules)}。输入“接受决斗”或“拒绝决斗”</div>` : ""}
    ${s.challenging ? `<div class="sys">你向${esc(s.challenging)}申请了决斗，等对方接受</div>` : ""}
    ${s.items.length ? `<h2>地上</h2><ul>${s.items.map(i => li(i.ref, i.name,
      i.quantity > 1 ? `<span class="tag">x${i.quantity}</span>` : "", i.fill, i.detail)).join("")}</ul>` : ""}
    ${foldHead("equip", "装备")}
    <ul class="equip fold-body">${s.equipment.map(e => e.item
      ? `<li data-name="卸下${esc(e.item.name)}" data-detail="${esc(e.item.detail || "")}"><span class="tag slot">${e.label}</span>${esc(e.item.name)}</li>`
      : `<li class="empty"><span class="tag slot">${e.label}</span>—</li>`).join("")}</ul>
    ${foldHead("skills", "技能")}
    <ul class="equip fold-body">${s.skills.map(k => `<li class="empty">${k.name} ${k.level}<span class="tag">${k.have}/${k.need}</span></li>`).join("")}</ul>
    <h2>背包</h2>
    <ul>${s.inventory.map(i => li(i.ref, i.name,
      i.quantity > 1 ? `<span class="tag">x${i.quantity}</span>` : "", i.name, i.detail)).join("") || '<li class="sys">空</li>'}</ul>
    <h2>命令</h2>
    <div id="help">
      看 · 北 南 东 西 上 下<br>
      拿 · 扔 · 装备 · 卸下 · 吃 · 喂 · 给 · 给钱（给麦琪5金币）· 买 · 卖（把药草卖给麦琪）· 升级（找莉娜）· 住店（酒馆）<br>
      打 · 躲起来 · 搜索 · 说 · 对某人说 · 安抚野兽（驯兽，避战）<br>
      地牢：扎营 · 回城（传送石边）· 传送到第 N 层（地窖）<br>
      跟着某人（就是加入他的队伍）· 不跟了 / 离队（地牢里、战斗中不行）<br>
      战斗中：全队都出完手，大家的命令一起按回合结算<br>
      急救 · 给人用药（给寒风灌血药）· 挣脱<br>
      决斗某人 · 接受决斗 · 拒绝决斗 · 逃跑<br>
      其他想做的事直接写，AI 判定
    </div>
    <h2></h2>
    <a href="#" id="logout" class="sys">换角色</a>　<a href="#" id="delete" class="sys">删除角色</a>`;
}

// 地牢小地图：5×5 的网格，偶数位是格子，奇数位是格子之间的门（连线）
const DOOR_POS = { north: "top:-13px", south: "bottom:-13px", west: "left:-11px", east: "right:-11px" };
function minimapHtml(m) {
  const n = m.grid, out = [];
  for (let r = 0; r < n * 2 - 1; r++) {
    for (let c = 0; c < n * 2 - 1; c++) {
      if (r % 2 === 0 && c % 2 === 0) {
        const cell = m.cells[(r / 2) * n + c / 2];
        const cls = cell.here ? "here walked" : cell.walked ? "walked" : cell.known ? "known" : "none";
        out.push(`<div class="c ${cls}">${esc(cell.mark || "")}${cell.door ? `<span class="door" style="${DOOR_POS[cell.door]}">锁</span>` : ""}</div>`);
      } else if (r % 2 === 0) {
        out.push(`<div class="h${m.cells[(r / 2) * n + (c - 1) / 2].east ? " on" : ""}"></div>`);
      } else if (c % 2 === 0) {
        out.push(`<div class="v${m.cells[((r - 1) / 2) * n + c / 2].south ? " on" : ""}"></div>`);
      } else out.push("<div></div>");
    }
  }
  return `<div class="minimap">${out.join("")}</div>
    <div class="tag">第 ${m.depth} 层小地图：入 入口 · 梯 楼梯间 · 宝 宝箱房 · 战 战斗 · 空 空房 · 事 事件${m.revealed ? "（已用地图残片显出整层）" : ""}${m.in_cell ? " · 你在牢房里" : ""}</div>`;
}

// 进入游戏时显示所在位置：只读状态，不发命令，不调 AI
// 同房间别人的动态（第三人称），轮询和命令结果里都会带
function eventHtml(kind, text) {
  if (kind === "combat") {
    // 【第 N 轮】/ 名字：结果；结果… / 敌人：…  → 标题一行，每条结果一行（跟平时一回合的 facts 一样）
    const [head, ...rows] = String(text).split("\n");
    return `<div class="round"><div class="sys">⚔ ${esc(head)}</div>` + rows.map(r => {
      const i = r.indexOf("：");
      const who = i > 0 ? r.slice(0, i) : "", body = i > 0 ? r.slice(i + 1) : r;
      return `<div class="sys" style="margin-top:4px">${esc(who)}</div>` +
        body.split("；").filter(Boolean).map(f => `<div class="fact">${esc(f)}</div>`).join("");
    }).join("") + `</div>`;
  }
  if (kind === "combat_story") return `<div class="narrative">${esc(text)}</div>`;
  return `<div class="other">${esc(text)}</div>`;
}

function showEvents(s) {
  for (const ev of s.events || []) {
    if (shownEvents.has(ev.id)) continue;
    shownEvents.add(ev.id);
    log(eventHtml(ev.kind, ev.text));
  }
  if (s.last_event_id != null) lastEventId = Math.max(lastEventId ?? 0, s.last_event_id);
}

// 之前的聊天框记录（服务器存的，换设备也在）
async function showHistory() {
  const rows = await api(`/api/history?player_id=${playerId}`).catch(() => []);
  for (const r of rows) {
    if (r.kind === "turn") {
      log(`<div class="you">&gt; ${esc(r.input)}</div>`);
      logTurn(r);
    } else {
      shownEvents.add(r.event_id);
      log(eventHtml(r.kind, r.text));
    }
  }
  if (rows.length) log(`<div class="sys">（以上是之前的记录）</div>`);
}

async function enter() {
  if (!playerId) return;            // 重试期间已经退出了
  try {
    const s = await api(`/api/state?player_id=${playerId}`);
    trackRound(s);
    lastEventId = s.last_event_id;   // 进来之前的动态不补，历史记录里有看过的
    await showHistory();
    render(s);
    const list = (label, arr) => arr.length ? `<div>${label}：${arr.map(esc).join("、")}</div>` : "";
    log(`<div class="sys"><b>${esc(s.room.name)}</b>　${esc(s.room.description)}` +
      list("出口", s.exits.map(e => `${e.label}（${e.to}${e.locked ? "，锁着" : ""}）`)) +
      list("这里有", s.npcs.map(n => n.name)) +
      list("地上有", s.items.map(i => i.name)) +
      list("其他玩家", s.others.map(o => o.name + (o.hp <= 0 ? "（倒下了）" : o.awake ? "" : "（睡着了）"))) + `</div>`);
    entered = true;
  } catch (e) {
    // 只有角色真的不存在才回登录页；连不上就过几秒再试，别把人踢出去
    if (e.status === 404) logout();
    else setTimeout(enter, 3000);
  }
}

let entered = false;                // enter 成功之前 refresh 不跑，免得重复显示
let offline = false;                // 连接中断时只提示一次
// 战斗中轮询快一点，回合结果出来能马上看到
let inCombat = false;
function trackRound(s) { inCombat = !!s.combat; }

let lastRefresh = 0;
async function refresh() {
  if (!playerId || !entered) return;
  lastRefresh = Date.now();
  try {
    const s = await api(`/api/state?player_id=${playerId}` + (lastEventId != null ? `&after=${lastEventId}` : ""));
    trackRound(s);
    if (offline) { offline = false; log(`<div class="sys">已经重新连上了</div>`); }
    showEvents(s);
    render(s);
  } catch (e) {
    if (e.status === 404) { logout(); return; }
    if (!offline) { offline = true; log(`<div class="sys">连接中断，正在自动重连…</div>`); }
  }
}

async function deleteCharacter() {
  const name = document.querySelector("#side h2")?.textContent || "这个角色";
  if (!confirm(`确定删除「${name}」？删了就没了，身上的东西会掉在原地。`)) return;
  try {
    await api("/api/delete", { player_id: playerId });
    playerId = null;
    try { localStorage.removeItem("newera.player"); } catch {}
    $("#log").innerHTML = "";
    $("#login").style.display = "flex";
  } catch (err) { alert(err.message); }
}

function logout() {
  // 角色留在原地睡着，别人能看到
  if (playerId) fetch("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify({ player_id: playerId }) }).catch(() => {});
  playerId = null;
  entered = offline = false;
  try { localStorage.removeItem("newera.player"); } catch {}
  $("#login").style.display = "flex";
}

$("#login-form").onsubmit = async e => {
  e.preventDefault();
  try {
    const code = $("#login-code").value;
    const { player_id } = await api("/api/login", {
      name: $("#login-name").value, password: $("#login-password").value, access_code: code,
    });
    try { localStorage.setItem("newera.code", code); } catch {}
    $("#login-password").value = "";
    playerId = player_id;
    try { localStorage.setItem("newera.player", playerId); } catch {}
    $("#login").style.display = "none";
    $("#log").innerHTML = "";
    await enter();
    $("#cmd").focus();
  } catch (err) { alert(err.message); }
};

const STAGES = { parse: "理解你的意图", execute: "判定结果", narrate: "书写叙事" };

// 流式读取回合：服务器每进入一步推一行 {"stage": ...}，最后一行 {"done": ...}
async function runTurn(text, onStage) {
  const res = await fetch("/api/command", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ player_id: playerId, text, after: lastEventId }),
  });
  if (!res.ok) throw new Error(res.statusText);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const ev = JSON.parse(buf.slice(0, i));
      buf = buf.slice(i + 1);
      if (ev.stage) onStage(ev.stage);
      if (ev.error) throw new Error(ev.error);
      if (ev.done) return ev.done;
    }
  }
  throw new Error("连接中断");
}

// 一回合的结果：解析、facts、叙事。历史记录里的回合没有耗时
const SOURCES = { ai: "AI 解析", rules: "规则解析", command: "命令" };
function logTurn(d, secs) {
  const parsed = d.actions.map(a => JSON.stringify(a)).join("  ");
  const cost = (d.usage.input || d.usage.output ? ` · token ${d.usage.input} 入 / ${d.usage.output} 出` : "") +
    (secs ? ` · ${secs}s` : "");
  const facts = d.results.map(r =>
    r.facts.map(f => `<div class="fact${r.success ? "" : " fail"}">${esc(f)}</div>`).join("")).join("");
  log(`<div class="parsed">[${SOURCES[d.source] || d.source}${cost}] ${esc(parsed)}</div>` +
    (d.narrative ? `<div class="narrative">${esc(d.narrative)}</div><details><summary>facts</summary>${facts}</details>` : facts) +
    d.notes.map(n => `<div class="sys">${esc(n)}</div>`).join(""));
}

// 这一回合判定完之前输入框锁住，不能接着发
function lockInput(locked) {
  $("#cmd").disabled = locked;
  $("#cmd-form button").disabled = locked;
  $("#cmd").placeholder = locked ? "等待判定结果…" : "比如：拿面包；北；对麦琪 来杯黑啤";
  if (!locked) $("#cmd").focus();
}

async function send(text) {
  lockInput(true);
  log(`<div class="you">&gt; ${esc(text)}</div>`);
  // 等待提示：显示当前步骤和已等待秒数，结果出来后移除
  const pending = document.createElement("div");
  pending.className = "entry pending";
  $("#log").append(pending);
  const start = Date.now();
  let stage = "execute";
  const tick = () => { pending.textContent = `⏳ ${STAGES[stage]}… ${Math.floor((Date.now() - start) / 1000)}s`; };
  tick();
  const timer = setInterval(tick, 250);
  $("#log").scrollTop = $("#log").scrollHeight;
  try {
    const d = await runTurn(text, s => { stage = s; tick(); });
    showEvents(d.state);              // 等待期间别人做的事先显示
    logTurn(d, ((Date.now() - start) / 1000).toFixed(1));
    trackRound(d.state);
    render(d.state);
  } catch (err) {
    log(`<div class="fact fail">${esc(err.message)}</div>`);
  } finally {
    clearInterval(timer);
    pending.remove();
    lockInput(false);
  }
}

$("#cmd-form").onsubmit = e => {
  e.preventDefault();
  const text = $("#cmd").value.trim();
  if (!text || $("#cmd").disabled) return;
  $("#cmd").value = "";
  if (cmdHistory.at(-1) !== text) cmdHistory.push(text);
  if (cmdHistory.length > HISTORY_MAX) cmdHistory.shift();
  histPos = cmdHistory.length;
  draft = "";
  send(text);
};

// 像命令行一样：↑ 翻出之前输入过的，↓ 翻回来，翻到底回到没发出去的草稿
const HISTORY_MAX = 50;
const cmdHistory = [];
let histPos = 0, draft = "";
$("#cmd").addEventListener("keydown", e => {
  if ((e.key !== "ArrowUp" && e.key !== "ArrowDown") || e.isComposing || !cmdHistory.length) return;
  e.preventDefault();
  if (histPos === cmdHistory.length) draft = $("#cmd").value;
  histPos = Math.max(0, Math.min(cmdHistory.length, histPos + (e.key === "ArrowUp" ? -1 : 1)));
  const input = $("#cmd");
  input.value = histPos === cmdHistory.length ? draft : cmdHistory[histPos];
  input.setSelectionRange(input.value.length, input.value.length);
});

// 窄屏：按住输入框上沿的拖动条（或输入框两边的空白）上下拖，调信息栏高度；拖到很矮就收起，高度记在本机
const SIDE_MIN = 60;                // 比这更矮就当收起
function setSideHeight(h) {
  const hidden = h < SIDE_MIN;
  document.body.classList.toggle("side-hidden", hidden);
  if (!hidden) document.documentElement.style.setProperty("--side-h", Math.round(h) + "px");
  return hidden ? 0 : Math.round(h);
}
try {
  const saved = localStorage.getItem("newera.sideH");
  if (saved !== null) setSideHeight(+saved);
} catch {}
$("#cmd-form").addEventListener("pointerdown", e => {
  if (!matchMedia("(max-width: 720px)").matches) return;
  if (e.target.id !== "grip" && e.target !== e.currentTarget) return;   // 点输入框、按钮照常
  e.preventDefault();
  const form = e.currentTarget;
  try { form.setPointerCapture(e.pointerId); } catch {}                  // 手指拖出表单范围也继续跟
  document.body.classList.add("dragging");
  const grabOffset = e.clientY - form.getBoundingClientRect().top;       // 手指按在表单的哪个位置
  let h = null;
  const move = ev => {
    // 信息栏高度 = 屏幕底部到表单底边的距离；最多留 80px 给聊天记录
    const formBottom = ev.clientY - grabOffset + form.offsetHeight;
    h = setSideHeight(Math.min(innerHeight - formBottom, innerHeight - form.offsetHeight - 80));
    $("#log").scrollTop = $("#log").scrollHeight;
  };
  const up = () => {
    form.removeEventListener("pointermove", move);
    document.body.classList.remove("dragging");
    if (h !== null) try { localStorage.setItem("newera.sideH", h); } catch {}
  };
  form.addEventListener("pointermove", move);
  form.addEventListener("pointerup", up, { once: true });
  form.addEventListener("pointercancel", up, { once: true });
});

$("#side").onclick = e => {
  if (e.target.id === "logout") { e.preventDefault(); logout(); return; }
  if (e.target.id === "delete") { e.preventDefault(); deleteCharacter(); return; }
  const head = e.target.closest("h2[data-fold]");
  if (head) {
    const key = head.dataset.fold;
    folded.has(key) ? folded.delete(key) : folded.add(key);
    head.classList.toggle("closed", folded.has(key));
    try { localStorage.setItem("newera.folded", JSON.stringify([...folded])); } catch {}
    return;
  }
  // 有详情的东西（物品、技能、光亮）点一下先弹小窗看详情，按"输入"才填名字。电脑手机一样：
  // 以前电脑靠悬停（title），有的手机也报自己能悬停，结果看不到详情
  const info = e.target.closest("[data-detail]");
  if (info && info.dataset.detail) { showTip(info); return; }
  const li = e.target.closest("li[data-name]");
  if (li) { $("#cmd").value += li.dataset.name; $("#cmd").focus(); }
};

function showTip(el) {
  let tip = $("#tip");
  if (!tip) {
    tip = document.createElement("div");
    tip.id = "tip";
    document.body.append(tip);
  }
  // 标题是去掉编号的名字；物品详情第一行已经是名字了就不重复
  const head = el.cloneNode(true);
  head.querySelectorAll(".ref, .tag").forEach(r => r.remove());
  const label = head.textContent.trim();
  const name = el.matches("li") && !el.dataset.detail.startsWith(label) ? label : "";
  tip.innerHTML = `${name ? `<div class="name">${esc(name)}</div>` : ""}<div class="detail">${esc(el.dataset.detail)}</div>
    <div class="btns">${el.dataset.name ? `<button class="fill">输入</button>` : ""}<button class="close">关闭</button></div>`;
  tip.querySelector(".close").onclick = hideTip;
  const fill = tip.querySelector(".fill");
  if (fill) fill.onclick = () => { $("#cmd").value += el.dataset.name; hideTip(); $("#cmd").focus(); };
  // 窄屏（手机）放在点的东西下面，下面放不下就放上面；宽屏放在侧栏左边、跟那一项对齐
  const r = el.getBoundingClientRect();
  const wide = innerWidth > 720;
  tip.style.top = tip.style.bottom = "";
  tip.style.left = wide ? "auto" : "";
  tip.style.right = wide ? `${innerWidth - $("#side").getBoundingClientRect().left + 8}px` : "";
  tip.style.width = wide ? "380px" : "";
  tip.style.visibility = "hidden";
  tip.hidden = false;
  if (wide) tip.style.top = `${Math.max(8, Math.min(r.top, innerHeight - tip.offsetHeight - 8))}px`;
  else if (r.bottom + tip.offsetHeight + 8 < innerHeight) tip.style.top = `${r.bottom + 6}px`;
  else tip.style.bottom = `${Math.max(8, innerHeight - r.top + 6)}px`;
  tip.style.visibility = "";
}
function hideTip() { const tip = $("#tip"); if (tip) tip.hidden = true; }
// 点小窗外面、滚动信息栏就关掉
document.addEventListener("pointerdown", e => { if (!e.target.closest("#tip, #side [data-detail]")) hideTip(); });
$("#side").addEventListener("scroll", hideTip);

if (playerId) { $("#login").style.display = "none"; enter(); }
// 没有 WebSocket，先轮询看其他玩家的变化：平时 3 秒一次，战斗中 1 秒一次（回合结果要跟得上）
setInterval(() => { if (inCombat || Date.now() - lastRefresh >= 3000) refresh(); }, 1000);

// 关页面、关浏览器、跳走时让角色立刻睡着，不用等心跳超时。sendBeacon 在页面关掉时也能发出去。
// 刷新也会触发，新页面第一次心跳会把人叫醒；切标签页、手机切后台不算退出，不触发
addEventListener("pagehide", () => {
  if (playerId) navigator.sendBeacon("/api/logout",
    new Blob([JSON.stringify({ player_id: playerId })], { type: "application/json" }));
});
</script>
