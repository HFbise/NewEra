# 地牢物品：格式跟 world.yaml 的 items: 一样，seed 时合并进去
#
# ---------------------------------------------------------------------------
# 新增的 props 键
#   light: N          光亮 +N，不写 burning 就不会烧完。永久光源（没有 burning）身上只算最亮的一件，火把另外叠加；
#                     永久光源压在 +10~+15，只管"不至于摸黑挨揍"，要好好打一架还得靠火把
#   two_handed: true  占两只手，不能再拿盾、火把或副手武器
#   cursed: true      装上就卸不下来，要找诺艾尔解咒（收钱）
#   用掉型道具的新键：cure（解某个状态）、refuel（把弱光火把烧回某个样子）、whet（这一层武器伤害 +N）、
#     reveal_floor（显示这一层地图）、holy（对亡灵/怕光怪打一下，值是伤害档位）、room_light（这个房间光亮 +N）、
#     throw（能掷出去，值是最高伤害档位）、opens（能开的特殊锁）、uses（能用几次，不写就是 1 次）
#
# props.effects：装备着时的特殊效果，一个列表，每条：
#   when   什么时候触发
#     passive  一直生效
#     attack   每次普通攻击（打没打中都算）
#     hit      普通攻击打中时
#     kill     杀死一个敌人时
#     hurt     自己被打中时
#     fight    每场战斗自己的第一次攻击
#     enter    走进一个新房间时
#   do     效果
#     splash       房间里其他每个敌人各挨 value 点伤害（不减防御）
#     chain        再随机打另一个敌人 value 点伤害（不减防御）
#     bonus        这一击额外 +value 伤害
#     pierce       无视对方 value 点防御
#     guard        受到的伤害 −value（最少 1）
#     heal         自己回 value 点血（直接是血，不是回血点数）
#     leech        回这一击造成伤害 × value 的血（向上取整）
#     status       给目标上状态 kind（poison bleed blind corrode restrained prone stun）
#     status_all   给房间里所有敌人上状态 kind
#     reflect      打你的那个敌人挨 value 点伤害（不减防御）
#     dodge        完全躲开这一下（配 chance 用）
#     resist       kind 状态的几率 × value（0 就是免疫，0.5 是减半）
#     max_hp       血量上限 +value（负数就是减）
#     skill        技能 kind 的判定 +value（athletics investigation sleight nature，其他技能的 key 按引擎里的改）
#     gold         打怪掉的金币 × (1 + value)
#     flee         逃跑难度 +value（负数是更容易）
#     wade         积水地面不减闪避、逃跑不加难度
#     darkvision   光亮低于 50 时普通攻击命中不打折
#     self_damage  自己掉 value 血
#     cheat_death  这一下本来会倒，改成剩 1 血
#     aura         同房间的队友和自己，kind（attack / defense）+value
#   chance 触发几率 0~1，不写就是 1
#   vs     只对带这些标签的敌人：undead（要给骷髅兵、食尸鬼、游魂、守陵人加 undead: true）/ animal / light_averse
#   if     条件：hp_below（自己血量低于这个比例）、target_hp_below、ally_down（同房间有队友倒下）
#   once   per_fight / per_floor：每场战斗、每层最多触发一次
#   label  触发时给 AI 的描写，跟怪物 on_hit 的 label 一样
# ---------------------------------------------------------------------------

items:
  forge_rubbing:                # 熔岩吊桥上拿的，送给莉娜：第一次送解锁"深层锻造"（tier 1 以上的装备升级上限 +15）
    name: 矮人锻造纹拓片
    description: 一张从铜匣上拓下来的厚皮纸，上面是一圈圈复杂的锻造纹，纹路的走向跟莉娜铁匠铺墙上那几道一模一样。
    type: misc
    props: {price: 30, gift: ore, gift_value: 10, unlock: lina_deep_forge}
  dwarf_hand_axe:              # 深层第一档（tier 1，16 层起）：掉落时孔数按稀有度再高一档
    name: 矮人手斧
    description: 一把斧刃宽得像铲子的短柄斧，斧背铸着一个小小的王冠，拿在手里沉甸甸的。
    type: weapon
    damage: 95
    props: {price: 180, tier: 1}
  dwarf_warhammer:
    name: 矮人战锤
    description: 一柄双手长锤，锤头一面平一面尖，尖的那面专门用来凿穿铠甲。
    type: weapon
    damage: 135
    props:
      price: 260
      tier: 1
      two_handed: true
      effects:
        - {when: hit, do: pierce, value: 10}
  dwarf_plate:
    name: 矮人板甲
    description: 一整套用黑铁锻打的胸甲，铆钉排得整整齐齐，内衬是还没烂的厚毛毡。
    type: armor
    slot: chest
    defense: 40
    props: {price: 200, tier: 1}
  dwarf_bulwark:
    name: 矮人壁盾
    description: 一面方形的铁盾，边缘包着一圈铜，盾面上铸着一座熔炉的图案。
    type: armor
    slot: hand
    defense: 40
    props: {price: 200, tier: 1, block: 0.15}
  salamander_boots:
    name: 火蜥蜴皮靴
    description: 用火蜥蜴的红鳞皮缝的靴子，鞋底厚实，踩在烧红的石头上也不觉得烫。
    type: armor
    slot: feet
    defense: 20
    props:
      price: 120
      tier: 1
      effects:
        - {when: passive, do: heat_resist, value: 0.5}      # 灼热掉的血减半
  forge_king_hammer:           # 矮人王的铸像掉落，二选一
    name: 矮人王的锻锤
    description: 铸像手里那柄比人还高的锻锤，锤头上的锻造纹还在隐隐发红。
    type: weapon
    damage: 150
    props:
      price: 400
      tier: 1
      two_handed: true
      effects:
        - {when: hit, do: pierce, value: 20}
        - {when: hit, do: status, kind: prone, chance: 0.2, label: 锻锤砸得地面一震，对方站不稳了}
  forge_heart:
    name: 熔炉之心
    description: 从铸像胸口炉门里掏出来的一块炉芯，用铁链穿着，戴在胸前暖烘烘的，从来不会凉。
    type: armor
    slot: neck
    defense: 20
    props:
      price: 350
      tier: 1
      light: 25                         # 炉芯的红光：第一档深层的被动光亮
      effects:
        - {when: passive, do: max_hp, value: 60}
        - {when: passive, do: heat_resist, value: 0}         # 不怕灼热
  scrap_iron:                  # 找莉娜拆解地牢装备得来，垫在升级里（每份成功率 +5%，一次最多四份）；以后宝石打孔也用它
    name: 碎铁
    description: 一小块从拆开的装备上敲下来的好铁，莉娜说回炉的时候添一点，火候好掌握。
    type: misc
    stackable: true
    props: {price: 5}
  # ===================== 通用 =====================
  steel_shortsword:
    name: 精钢短剑
    description: 剑身泛着冷冷的青光，护手上刻着一个早就没人认得的铁匠印记，挥起来比看着轻。
    type: weapon
    damage: 70
    props: {price: 49}
  war_hammer:                  #双手、破甲
    name: 双手战锤
    description: 锤头有小孩脑袋那么大，柄上缠着磨得发亮的皮条，砸在铁甲上会留下一个坑。
    type: weapon
    damage: 100
    props:
      price: 95
      two_handed: true
      effects:
        - {when: hit, do: pierce, value: 20}
  vigor_ring:
    name: 活力之戒
    description: 一枚暖烘烘的红铜指环，戴上以后心跳都沉稳了几分。
    type: armor
    slot: ring
    props:
      price: 40
      effects:
        - {when: passive, do: max_hp, value: 30}
  lucky_coin:                  #会加速通胀，建议只做这一件、两个戒指位不叠加
    name: 幸运古币
    description: 一枚被人钻了孔、穿在指环上的古金币，正面的头像被摸得看不清了。
    type: armor
    slot: ring
    props:
      price: 35
      effects:
        - {when: passive, do: gold, value: 0.15}
  # ===================== 远程武器 =====================
  # ranged：贴身难射、离远了准（engine.RANGED_HIT：贴身 45%、一步 75%、几步开外 90%）；steady 的远近都 90%。
  # 一轮只能做两件事，射完要装填，所以远程一轮只打一发（近战能砍两下）：单发伤害比同档近战高四成左右
  # 射完换成 unloaded 那个"（空）"，说"装填"才能再射（算一个动作）。two_handed 要两只手
  sling:
    name: 投石索
    description: 一根磨得发亮的皮索，兜里放一颗石子甩出去，打得又准又狠。单手就能用，射完要再装一颗石子（说"装填"）。
    type: weapon
    slot: hand
    damage: 60
    props: {ammo_kind: sling, price: 25, ranged: true, unloaded: sling_empty}
  sling_empty:
    name: 投石索（空）
    description: 皮兜里空了，得再装一颗石子才能甩（说"装填"）。
    type: weapon
    slot: hand
    damage: 60
    props: {ammo_kind: sling, price: 25, loads: sling}
  hunting_bow:
    name: 猎弓
    description: 一张用韧木和兽筋做的短弓，要两只手才拉得开。离得越远越准，贴身了就不好使；射完要重新搭箭（说"装填"）。
    type: weapon
    slot: hand
    damage: 100
    props: {ammo_kind: arrow, price: 55, ranged: true, two_handed: true, unloaded: hunting_bow_empty}
  hunting_bow_empty:
    name: 猎弓（空）
    description: 弦上没搭箭，得重新搭一支才能射（说"装填"）。
    type: weapon
    slot: hand
    damage: 100
    props: {ammo_kind: arrow, price: 55, two_handed: true, loads: hunting_bow}
  bone_bow:
    name: 骨弓
    description: 骷髅弓手那张缠满蛛丝的骨弓，弓身冰凉，要两只手拉。射向亡灵的箭格外狠；射完要重新搭箭（说"装填"）。
    type: weapon
    slot: hand
    damage: 80
    props:
      ammo_kind: arrow
      price: 60
      ranged: true
      two_handed: true
      unloaded: bone_bow_empty
      effects:
        - {when: hit, do: bonus, value: 20, vs: [undead]}
  bone_bow_empty:
    name: 骨弓（空）
    description: 弦上没搭箭，得重新搭一支才能射（说"装填"）。
    type: weapon
    slot: hand
    damage: 80
    props: {ammo_kind: arrow, price: 60, two_handed: true, loads: bone_bow}
  heavy_crossbow:
    name: 绞盘重弩
    description: 弩手狱卒那把沉重的绞盘弩，要两只手端着，远近一样准，扁铁箭头能打穿铠甲；上一次弦很费劲（说"装填"）。
    type: weapon
    slot: hand
    damage: 130
    props:
      ammo_kind: arrow
      price: 120
      ranged: true
      steady: true
      two_handed: true
      unloaded: heavy_crossbow_empty
      effects:
        - {when: hit, do: pierce, value: 10}
  heavy_crossbow_empty:
    name: 绞盘重弩（空）
    description: 弦松着，得转着绞盘重新上弦才能射（说"装填"）。
    type: weapon
    slot: hand
    damage: 130
    props: {ammo_kind: arrow, price: 120, two_handed: true, loads: heavy_crossbow, reload_steps: 2}   # 绞盘要摇两次
  tower_shield:
    name: 塔盾
    description: 一面几乎有半人高的包铁木盾，举起来能把整个人藏在后面，专挡箭矢、石子和飞过来的东西。
    type: armor
    slot: hand
    defense: 30
    props:
      price: 45
      block: 0.15                # 格挡：几率完全挡下一击（跟闪避合计最多 30%）
      effects:
        - {when: hurt, do: guard, value: 20, vs: [ranged]}

  # ===================== 远程：更多武器 =====================
  hand_crossbow:
    name: 手弩
    description: 一把只有小臂长的轻弩，弩臂是牛角做的，单手就能端平，另一只手还能拿盾；上弦要费点劲（说"装填"）。
    type: weapon
    slot: hand
    damage: 80
    props: {price: 45, ranged: true, ammo_kind: arrow, unloaded: hand_crossbow_empty}
  hand_crossbow_empty:
    name: 手弩（空）
    description: 弦松着，得重新上弦才能射（说"装填"）。
    type: weapon
    slot: hand
    damage: 80
    props: {price: 45, ammo_kind: arrow, loads: hand_crossbow}
  repeater_crossbow:
    name: 连弩
    description: 弩身上架着一只木匣，里面码着三支短箭，扳一下机括就能再上一支；三发射完得整匣重装（说"装填"）。要两只手端。
    type: weapon
    slot: hand
    damage: 50
    props: {price: 70, ranged: true, two_handed: true, magazine: 3, unloaded: repeater_crossbow_empty}   # 连发：一匣三发，不能装特殊弹药
  repeater_crossbow_empty:
    name: 连弩（空）
    description: 木匣空了，得整匣重装才能再射（说"装填"）。
    type: weapon
    slot: hand
    damage: 50
    props: {price: 70, two_handed: true, loads: repeater_crossbow}
  throwing_knives:
    name: 一套飞刀
    description: 三把没有护手的细长小刀插在皮套里，刀尾缠着红布，扔出去看得清落在哪。不用装填，扔完了打完这一架自然捡回来。单手。
    type: weapon
    slot: hand
    damage: 40
    props: {price: 35, ranged: true, thrown: true, magazine: 3, unloaded: throwing_knives_empty}   # thrown：扔出去的，说法是"掷出"
  throwing_knives_empty:
    name: 一套飞刀（扔完了）
    description: 皮套空了，刀都扔在地上。打完这一架（房间里没有敌人了）自然会捡回来。
    type: weapon
    slot: hand
    damage: 40
    props: {price: 35, loads: throwing_knives, recover: true}

  # ===================== 远程：特殊弹药（装填时说"用钩索箭装填"，下一发带上它的效果，射出去就用掉）=====================
  # ammo 是种类：arrow 箭（弓、弩都能装）/ sling 石子（投石索）
  grapple_bolt:
    name: 钩索箭
    description: 箭头是一只三爪铁钩，尾巴拴着细麻绳，射中了一拽，谁也跳不开。弓、弩都能用。
    type: misc
    stackable: true
    props:
      price: 4
      ammo: arrow
      effects:
        - {when: hit, do: status, kind: restrained, label: 被铁钩咬住，一拽就扯了回来}
  fire_arrow:
    name: 火油箭
    description: 箭杆前端缠着浸过火油的麻布，射出去之前在火把上一点就着。弓、弩都能用。
    type: misc
    stackable: true
    props:
      price: 3
      ammo: arrow
      fire: true                 # 带火：打怕火的头目（古树守卫、沼泽女巫）伤害 ×1.5
      effects:
        - {when: hit, do: bonus, value: 20}
        - {when: hit, do: bonus, value: 20, vs: [light_averse], label: 火苗一沾身，它尖叫着往后缩}
  lead_shot:
    name: 铅弹
    description: 一小袋灌了铅的圆石子，比普通石头沉一倍，砸在铁甲上会凹进去。投石索用。
    type: misc
    stackable: true
    props:
      price: 2
      ammo: sling
      effects:
        - {when: hit, do: pierce, value: 20}

  # ===================== 远程：配件和对策 =====================
  quiver_belt:
    name: 箭袋腰带
    description: 一条宽皮腰带，右边缝着斜插的箭袋，手一垂就能摸到箭尾。每场第一次射空时，顺手就装好了。
    type: armor
    slot: belt
    props:
      price: 35
      effects:
        - {when: passive, do: free_reload}
  hunter_ring:
    name: 猎手之戒
    description: 一枚刻着鹿角纹的骨戒，拉弦的时候戴在拇指上，勒出的印子从来消不掉。每场第一次用远程武器出手，伤害更高。
    type: armor
    slot: ring
    props:
      price: 40
      effects:
        - {when: fight, do: bonus, value: 30, weapon: ranged}
  smoke_bomb:
    name: 烟雾弹
    description: 一只糊着黄泥的陶球，摔碎了会冒出一大团呛人的灰烟，谁也看不清谁：两轮里远程命中减半，敌我都算。
    type: misc
    stackable: true
    props: {price: 6, smoke: 2}

  map_scrap:
    name: 地牢地图残片
    description: 半张画在兽皮上的地图，墨迹一碰到这一层的空气就自己动了起来。用掉后能知道这一层所有房间和宝箱房在哪。
    type: misc
    props: {price: 10, reveal_floor: true}
  bandage:                     #解状态
    name: 绷带
    description: 一卷洗得发白的亚麻布条，边上还缝着一小包止血粉。
    type: consumable
    heal: 2
    props: {price: 3, cure: bleed, kind: salve}
  lamp_oil:
    name: 灯油
    description: 一只塞着软木塞的小陶瓶，里面的油又稠又黑，闻着有股松脂味。倒在快灭的火把上能让它重新烧旺。
    type: misc
    props: {price: 3, refuel: torch_lit}
  whetstone:                   #临时增益
    name: 磨刀石
    description: 一块灰色的细磨石，一面已经被磨出了浅浅的凹槽。
    type: misc
    props: {price: 6, whet: 10}

  # ===================== 矿坑 =====================
  miner_pick:                  #破甲
    name: 矿工的短镐
    description: 镐头磨得只剩一半，木柄被汗浸成了黑色，敲在石头上火星四溅。
    type: weapon
    damage: 50
    props:
      price: 35
      effects:
        - {when: hit, do: pierce, value: 10}
        - {when: passive, do: skill, kind: athletics, value: 1}
  kobold_cap:                  #光亮
    name: 狗头人矿工帽
    description: 一顶对人来说太小的皮帽，帽檐上焊着一只拇指大的油灯，灯芯居然还能点着。
    type: armor
    slot: head
    defense: 10
    props: {price: 17, light: 10}
  miner_lamp:                  #光亮
    name: 矿工灯
    description: 一盏黄铜外壳的矿灯，玻璃罩上有道裂纹，挂在腰带上晃晃悠悠地亮着，不占手。
    type: armor
    slot: belt
    props: {price: 40, light: 10}
  beetle_shell_shield:         #抗性
    name: 岩甲虫壳盾
    description: 一片岩甲虫的背壳，内侧钉了两根皮带当把手，敲上去像敲石头。占一只手。
    type: armor
    slot: hand
    defense: 30
    props:
      price: 33
      block: 0.15
      effects:
        - {when: passive, do: resist, kind: prone, value: 0.5}
  foreman_mattock:             #头目掉落
    name: 工头的鹤嘴锄
    description: 沾满血锈的鹤嘴锄，比普通矿镐长出一截，锄尖被磨得像矛头。
    type: weapon
    damage: 90
    props:
      price: 86
      two_handed: true
      effects:
        - {when: hit, do: pierce, value: 20}
        - {when: hit, do: status, kind: prone, chance: 0.2, label: 被鹤嘴锄勾倒在地}
  foreman_plate:               #头目掉落
    name: 工头的矿车铁皮甲
    description: 用矿车铁皮敲成的护甲，铆钉歪歪扭扭，穿上去叮当乱响，跑起来很吃力。
