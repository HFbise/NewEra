# ======================= 关卡头目（第 25、50、75……层） =======================
# 每 25 层的楼梯间随机一位，这一层的主题跟着头目走（theme）；本主题的头目不出。
# 楼梯间隔壁的前厅（休息点）有一块传送石，走进去就亮；最深到过这一层以下的人传送石本来就亮着。
# 没打倒过、又没到过更深的，下不去。每失败一次下次它的血 -5%（最多 -15%），打倒后清零。
# phases：血掉到 at 以下换一套招（进阶段时 label、env、summon、actions、atk、on_hit 一起生效）。
# 招式新写法：when: every_random（value: [最少, 最多] 次出手之间随机）、when: light_at_least（光亮够了才放，every 次一放）、
# strike 的 per_sin / convict / only_below、do: vanish / flight / petrify
gate_bosses:
  gate_desert:
    name: 在其山岳之上者
    title: 过秤者
    theme: desert
    loot: upon_mountain
    description: 沙丘最高处站着一个胡狼头的巨人，黑得发亮的身躯上缠着金色的饰带，一手握着冥界的权杖，一手提着一架黄金天平，脚下是那座被沙子吞没的亡者之城。
    persona: 冷静、庄重，像在主持一场审判。它不愤怒，也不追赶，只是一个一个地称量闯入者的心，再决定他们配不配通过。你在这场战斗里越是靠躲、靠喝药逃避，天平上你那一端就越沉。
    keen: true
    hp: 2.2                      # 初版4.0；模拟（带被动光亮）对到第 25 层普通档（带 4 瓶药）团灭 44%、上限档 1%
    atk: 10
    def: 20
    immune: [restrained, prone, wrapped]
    weak: fire
    room: {cover: true, light: dim}
    sin: {max: 6, sources: [consume, dodge, retreat, flee], after_weigh: halve}
    phases:
      - at: 1.0
        skills:
          - {when: every, value: 3, do: combo, target: all, label: 权杖顿地，沙砾从地缝里喷涌而出, effects: [{kind: blind}, {kind: bleed}]}
          - {when: every_random, value: [4, 6], do: telegraph, label: 举起天平，一根羽毛轻轻落在另一端（下一次出手称量打它最狠的人的心：罪越重越疼，狠狠砍它能打断）,
             then: {do: strike, mult: 2.0, target: highest_threat, per_sin: 0.4, convict: {sin_at_least: 4, effect: {kind: wound, heal_mult: 0, turns: 2}}}}
      - at: 0.7
        label: 身后的石门缓缓打开一道缝，裹着绷带的身影一个接一个走了出来
        env: {light: -20}
        summon: {kind: mummy, count: 2}
        skills:
          - {when: every, value: 4, do: combo, target: highest_threat, label: 一挥权杖，发黄的裹尸布从地下窜出来缠住了你, effects: [{kind: wrapped}, {kind: corrode}]}
          - {when: every_random, value: [4, 6], do: telegraph, label: 天平两端剧烈摇晃（下一次出手称量全场：罪越重越疼，躲到柱子后面也没用）,
             then: {do: strike, mult: 1.5, target: all, per_sin: 0.4, convict: {sin_at_least: 4, effect: {kind: wound, heal_mult: 0, turns: 2}}}}
      - at: 0.4
        label: 俯下身，胡狼的头颅越来越长，四肢着地，变成了一头比马还大的黑色胡狼
        actions: 1
        atk: 20
        env: {sealed: true}
        on_hit: {kind: bleed, chance: 0.5, label: 被胡狼的獠牙撕开了一道口子}
        skills:
          - {when: every, value: 3, do: strike, mult: 2.0, target: lowest_hp, label: 低吼一声，扑向了最虚弱的猎物}
          - {when: every_random, value: [3, 5], do: telegraph, label: 远处的天平自己晃动起来（下一次出手称量全场）,
             then: {do: strike, mult: 1.5, target: all, per_sin: 0.4}}
          - {when: hp_below, value: 0.15, do: self_heal, heal: 0.2, unless_status: burning, label: 叼起落在地上的生命之符，伤口上泛起金光（身上带着火就回不了）}

  gate_astral:
    name: 英仙座
    title: 弑英雄者
    theme: astral
    loot: perseus
    description: 一个披着青铜胸甲的年轻战士悬在星海上方，脚上的凉鞋生着一对白色小翼，左臂挂着一面亮得像镜子的圆盾，右手握着一把弯月形的镰刀，腰间悬着一只往下滴着黑血的皮袋。头顶那颗大陵五一明一暗，像一只眨着的眼睛。
    persona: 骄傲又从容，把闯进来的人都当成下一个要斩的怪物。他会在你以为占了上风的时候消失，再从你看不见的地方出手。藏起来的人他看得见，那点潜行的本事在他面前不值一提。
    keen: true
    hide_fails: true             # 在他面前躲藏必定失败，还会让他下一击 ×1.5
    grounded_weak: 1.5           # 被拽下来的那一轮挨的伤害 ×1.5
    hp: 3.2                      # 初版3.8；模拟（带被动光亮）对到第 25 层普通档团灭约 40%、上限档 1%
    atk: 20
    def: 20
    immune: [restrained]
    room: {cover: true, light: bright}
    phases:
      - at: 1.0
        skills:
          - {when: every, value: 4, do: vanish, sneak_mult: 1.8, label: 戴上一顶灰色的头盔，整个人像水汽一样散在了空气里（下一下打他会落空：群伤照样打得到，察觉过了能听声辨位）}
          - {when: light_at_least, value: 70, every: 3, do: telegraph, label: 把圆盾举到胸前，盾面把星光聚成了一束（下一次出手晃瞎所有睁着眼的人：闭眼能躲）,
             then: {do: combo, target: all, effects: [{kind: blind}], unless: eyes_closed}}
          - {when: every, value: 5, do: telegraph, label: 盯上了伤得最重的那个人，镰刀在手里转了半圈（血在三成五以下的人要挨一记斩首：先喝药或者打断）,
             then: {do: strike, mult: 3.0, target: lowest_hp, only_below: 0.35}}
      - at: 0.65
        label: 脚下的双翼猛地展开，整个人离地飞了起来
        actions: 1
        skills:
          - {when: every, value: 4, do: flight, rounds: 2, label: 在头顶盘旋，你一动他就俯冲下来（两轮里做什么都会被打断：用绳子、网、钩索箭或者抓住他的脚踝能把他拽下来）}
          - {when: every, value: 5, do: vanish, sneak_mult: 1.8, label: 在半空中散成一团水汽}
      - at: 0.35
        label: 解开腰间的皮袋，头顶的大陵五猛地暗了一下，一股冰冷的死气弥漫开来
        actions: 1
        atk: 10
        skills:
          - {when: every, value: 4, do: telegraph, label: 把手伸进皮袋里，大陵五的光一下子全聚到了他手上（下一次出手，睁着眼的人都会被石化一回合：闭眼能躲）,
             then: {do: petrify, target: all, unless: eyes_closed}}
          - {when: light_at_least, value: 70, every: 3, do: telegraph, label: 盾面又亮了起来（下一次出手晃瞎看着他的人）,
             then: {do: combo, target: all, effects: [{kind: blind}], unless: eyes_closed}}
          - {when: every, value: 5, do: vanish, sneak_mult: 2.0, label: 又一次散进了空气里}
          - {when: every, value: 7, do: telegraph, label: 盯上了伤得最重的那个人,
             then: {do: strike, mult: 3.0, target: lowest_hp, only_below: 0.35}}
