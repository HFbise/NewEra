# 远古地牢的内容：主题（每层随机一个）、怪物。生成规则在 dungeon.py
#
# 主题：
#   name      主题名，房间名前面会加"第 N 层·"
#   intro     进入这一层时的一句描写
#   entry / stairs / treasure    入口、楼梯间、宝箱房（各一个）
#   rooms     普通房间（战斗房、空房从这里随机抽，不重复）
#   features  可利用的环境物件，每个战斗房、楼梯间随机放 1 到 2 个（max_tier 是能打出的最重伤害档位）
#   monsters  这一层会出的怪（下面 monsters 里的 key）
#   boss      每 5 层楼梯间的头目
#   events    随机事件房从这些里抽（下面 events 里的 key）
#   eerie     走路时的怪声怪影（只是气氛）
#
# 随机事件房（events）：房间描写 + 一处能取东西的地方（跟酒馆武器桶一样的"取用处"），
#   skill / difficulty 是取东西要过的技能判定（难度再加 层数/4），fail 是失败时发生的事，fail_damage 失败掉的血；
#   每人每个房间只能拿到一次
#
# 走路时（地牢里两个房间之间）有 ROAD_EVENT_CHANCE 的几率碰上：陷阱（察觉发现就绕过去，没发现挨一下，耐性涨）、
#   地上的零钱、路边小木匣（普通补给）、怪声（eerie，循声去找就会引出一只游荡的怪）
#
# 怪物数值按层数算（dungeon.monster_stats），这里只写跟普通怪比的倍率和加减：
#   hp 血量倍率、atk 攻击加减、def 防御加减；animal: true 是野兽（以后驯兽能让它避战）；
#   keen: true 是警觉的怪（靠嗅觉、一动不动地守着；所有头目也是）：一进门就发现人，对它偷袭暗杀难度 +2；
#   undead: true 是亡灵（圣水、银匕首对它们特别有效）；light_averse: true 是怕光的怪，光亮 70 以上攻击 -1；
#   on_hit 打中时几率附带：poison 中毒（每回合掉血、命中降低）/ bleed 流血（每个动作掉血、伤害降低）/
#     blind 看不清（光亮算 0）/ corrode 腐蚀（防御、血量上限临时降低）/ restrained 缠住 / prone 撞倒
#
# 环境（房间描写里的 light / ground / cover）：
#   光亮 0~100 = 主题的 light（自然光亮）+ 房间的 light（bright +30 / dim 0 / dark -15）+ 点着的灯每盏 20 + 有人带火把 35。
#          低于 50 普通攻击命中开始打折，0 时只剩 5%；低于 20 做花样难度 +1、躲藏容易 1 级；
#          越暗怪越凶（光亮 25 以下攻击 +1，100 攻击 -1）、钱越多（最多 1.5 倍，最亮 0.5 倍）
#   ground water 积水泥泞：闪避效果减半，逃跑难度 +1
#   cover  true 有掩体：躲藏容易 1 级
#   环境物件 lamp: true（火盆、烛台）：点着时房间光亮 +20，被拿来砸人用掉之后灯灭了、光亮 -20

themes:
  mine:
    name: 远古矿坑
    light: 40                   # 自然光亮 0~100
    intro: 脚下的石阶变成了粗糙的矿道，空气里是陈年的煤灰和铁锈味，远处隐约有滴水声，像是有什么东西还在这里挖着。
    entry:
      name: 矿道入口
      light: dim
      description: 一段被凿开的斜坡，两侧的岩壁上还留着古老的镐痕，几根朽烂的木梁勉强撑着头顶。
      details: >-
        地上散落着锈成一团的矿灯和断了柄的镐头，岩壁上用红土画着看不懂的记号，像是箭头又像是警告。
        头顶的木梁被压得弯成弧形，偶尔簌簌落下细灰。身后来时的路隐没在一片黑暗里。
    stairs:
      name: 竖井边缘
      light: dark
      description: 矿道在这里断开，一口深不见底的竖井，井壁上凿着一圈往下盘的石阶。
      details: >-
        井口架着一台朽坏的绞盘，锁链垂进黑暗里，风从井底往上吹，带着更深处潮湿的土腥味。
        石阶窄得只容一人，边缘被磨得光滑，往下看只有一片漆黑。
    treasure:
      name: 塌了一半的储藏室
      light: dark
      description: 一间被落石堵了一半的小石室，角落里堆着几只腐朽的木箱。
      details: >-
        木箱上的铁箍早就锈穿了，有一只箱盖半开着。墙上的凹槽里还插着熄灭的火把，地上有一串早已干涸的脚印，只进不出。
    rooms:
      - name: 废弃矿道
        light: dark
        description: 狭长低矮的矿道，头顶不时有碎石落下，脚下是没过脚踝的碎矿渣。
        details: 岩壁上嵌着几道暗红的矿脉，摸上去冰凉。一辆翻倒的矿车卡在轨道拐角，轨道一直延伸进黑暗里。
      - name: 矿工营地
        light: dim
        description: 一处稍宽敞的石窟，中间有一圈烧黑的石头，像是很久以前有人在这里生过火。
        details: 石窟边上摆着几张烂成碎片的草垫，一只瘪掉的铜壶，墙上刻着一排排计数用的划痕，最后几道划得又深又乱。
      - name: 积水的坑道
        light: dark
        ground: water
        description: 坑道地势低洼，积着一层冰冷的黑水，水面上漂着不知道什么东西的碎屑。
        details: 水只到小腿，但底下的石头又湿又滑。水里偶尔泛起一圈涟漪，岩壁上挂着一层滑腻的白色苔藓。
      - name: 支撑柱大厅
        light: dim
        cover: true
        description: 一间被掏空的巨大石厅，几根粗大的石柱撑着穹顶，柱子上满是裂纹。
        details: 大厅中央堆着一座小山似的废矿石，石柱之间挂着断掉的锁链。说话会有回声，回声回来得比该有的慢。
      - name: 塌方的岔路
        light: dark
        cover: true
        description: 几条矿道在这里交汇，其中一条被塌下来的巨石彻底堵死。
        details: 巨石缝里伸出一只锈铁手套，没有人去动它。地上的轨道被砸弯，碎石堆上还留着新鲜的爪印。
      - name: 熔炉遗迹
        light: dim
        description: 一座早已冷却的古老熔炉，炉口大得能钻进一个人，四周散落着熔渣。
        details: 熔炉上铸着一圈古老的花纹，像是某种矮人的文字。炉膛里黑洞洞的，风从里面吹出来，带着一丝不该有的暖意。
    features:
      - {name: 翻倒的矿车, max_tier: heavy}
      - {name: 摇摇欲坠的木梁, max_tier: heavy}
      - {name: 碎石堆, max_tier: light}
      - {name: 垂下来的锁链, max_tier: light}
      - {name: 松动的岩壁, max_tier: heavy}
    monsters: [cave_rat, kobold, rock_beetle, kobold_slinger, kobold_shieldbearer]
    events: [ore_vein, spring, miner_cache]
    eerie:
      - 远处传来一声镐头敲在石头上的脆响，然后是很长的寂静。
      - 头顶簌簌落下一阵细灰，岩壁深处像是有什么东西翻了个身。
      - 一阵风从矿道深处吹来，带着一股不该出现在地底的、烤肉的香味。
    boss:
      name: 狗头人工头
      description: 比别的狗头人高出一头，披着用矿车铁皮敲成的护甲，手里拎着一把沾满血锈的鹤嘴锄。
      persona: 暴躁，嗓门大，把闯进矿坑的人当成偷矿的贼，会先吼叫着让手下围上来。
      on_hit: {kind: prone, chance: 0.3, label: 被鹤嘴锄撞翻在地}
      hp: 0.9
      deep_hp: 1.0                 # 第 16 层起的血量倍率（默认 1.3，模拟对线调的）
      atk: 0
      def: 10
      # 技能按层数解锁（rules.unlocked_skills）：第 5 层只会第一招，第 10 层两招，第 15 层起全套加狂暴
      immune: [prone]                 # 免疫：玩家打不上去的状态、效果
      weak: pierce                    # 弱点：破甲的打它伤害 ×1.5（rules.WEAK_MULT）
      skills:
        - {waves: [0.75, 0.5], do: summon, kind: kobold, label: 把铜哨塞进嘴里猛吹一声，巷道深处跑来了一个帮手}      # 分两次叫，每次一只（两只一起上团灭 6–9%）
        - {when: every, value: 3, do: status_all, kind: prone, escape: 2, label: 抡起鹤嘴锄砸向地面，震得所有人站不稳}
        - {when: every, value: 4, min_depth: 16, do: combo, target: all, label: 一镐砸塌了头顶的矿道，碎石劈头盖脸砸下来, effects: [{kind: prone, escape: 2, label: 被碎石砸倒在地}, {kind: bleed, label: 被碎石划开了口子}]}
        - {when: every, value: 5, min_depth: 16, do: telegraph, label: 把鹤嘴锄高高抡过头顶，死死盯着打它最狠的人, then: {do: strike, mult: 2.5, target: highest_threat, label: 鹤嘴锄带着风声砸了下来}}
        - {when: hp_below, value: 0.5, min_depth: 16, do: phase, label: 一镐砸断了撑着矿道的木梁，火把一支接一支灭了, env: {light: -15}, then: {do: summon, kind: kobold, count: 1, label: 巷道深处冲出一个满身伤疤的老矿工}}

  graveyard:
    name: 地下坟场
    light: 35                   # 自然光亮 0~100
    intro: 石阶尽头是一片低矮的墓穴，空气冷得发干，墙缝里渗出一股陈旧的香灰味，像是这里的祭祀从没停过。
    entry:
      name: 墓道口
      light: dim
      description: 一条两侧砌满骨龛的窄道，龛里摆着一排排头骨，空洞的眼眶都朝着来人。
      details: >-
        有几只龛里的头骨被人摆歪了，下面压着早已褪色的布条。地上撒着一层灰白的粉末，踩上去沙沙作响，分不清是灰还是骨粉。
    stairs:
      name: 地下祭坛
      light: dim
      description: 一座圆形的石坛，坛中央裂开一道口子，一段石阶沿着裂缝通往更深处。
      details: >-
        坛边的石柱上刻着一圈跪拜的人影，面孔都被凿掉了。裂缝里往上冒着淡淡的冷雾，雾里偶尔传来像是低语的声音。
    treasure:
      name: 陪葬品室
      light: dark
      description: 一间封闭的小墓室，石棺的盖子被推开了一半，旁边散落着陪葬的器物。
      details: >-
        石棺里躺着一具穿着锈甲的骸骨，双手交叠在胸前，像是在护着什么。墙上的壁画画着一群人往一个洞口里走，画到一半就断了。
    rooms:
      - name: 骨龛长廊
        light: dark
        description: 一条长长的回廊，两侧墙壁从地面到穹顶全是骨龛。
        details: 骨龛里的骸骨被码得整整齐齐，只有一排是空的，像是里面的东西自己走开了。地上有拖拽的痕迹。
      - name: 坍塌的墓室
        light: dark
        cover: true
        description: 一间天花板塌了半边的墓室，几具石棺被砸得东倒西歪。
        details: 断裂的石棺里空空如也。碎石下压着一截生锈的长剑，剑柄上缠着发黑的布条。
      - name: 守墓人小屋
        light: dim
        cover: true
        description: 墓穴里竟有一间石砌的小屋，门板歪在一边，里面摆着一张桌子和一张窄床。
        details: 桌上有一本被虫蛀烂的名册，最后一页写满了同一个名字。床底下露出一只扣着的铁盒，锁已经锈死了。
      - name: 沉默的礼拜堂
        light: dim
        cover: true
        description: 一间摆满长椅的石厅，尽头的祭台上立着一尊没有脸的雕像。
        details: 长椅上积着厚厚的灰，却有一张椅子干干净净，像是一直有人坐。雕像的手掌向上摊开，掌心里有一圈暗红的痕迹。
      - name: 万人坑
        light: dark
        description: 一个巨大的圆形深坑，坑底堆满了骸骨，一条窄窄的石桥横跨其上。
        details: 石桥没有护栏，桥面长着湿滑的苔藓。坑底的骨堆偶尔会自己塌下去一块，发出干脆的碎裂声。
      - name: 烛火长明的墓室
        light: bright
        description: 墓室四角的石台上点着蜡烛，火苗笔直不动，照得四周一片昏黄。
        details: 蜡烛看起来刚点上不久，蜡油却积了厚厚一层，像是烧了几百年。烛光照不到的角落里一片漆黑，黑得有点过分。
    features:
      - {name: 倾倒的墓碑, max_tier: heavy}
      - {name: 敞开的墓穴, max_tier: heavy}
      - {name: 锈铁栅栏, max_tier: light}
      - {name: 石棺盖, max_tier: heavy}
      - {name: 长明的烛台, max_tier: light, lamp: true}
    monsters: [skeleton, ghoul, wisp, skeleton_archer, grave_nun]
    events: [offering_wine, tomb_notes, spring]
    eerie:
      - 身后的骨龛里传来一声轻轻的咔哒，像是有颗头骨转了过来。
      - 冷风里夹着很低很低的吟诵声，听不清在念什么，一转身就停了。
      - 地上的骨粉上多了一串小小的脚印，比人的脚小，朝着你来的方向。
    boss:
      name: 守陵人
      undead: true
      description: 一具身披破烂法袍的高大骸骨，胸口嵌着一块发着幽光的石头，手里的长柄镰刀比人还高。
      persona: 沉默，动作缓慢而精准，把一切活人都当作要被安葬的东西，从不追出墓室。
      on_hit: {kind: corrode, chance: 0.3, label: 被镰刃带走了一股生气}
      hp: 0.9
      atk: 0
      def: 0
      immune: [bleed]                 # 一身骸骨，不会流血
      weak: holy
      skills:
        - {when: hp_below, value: 0.5, do: summon, kind: skeleton, count: 2, label: 把镰刀插进坟土，两具骷髅兵从地下爬了出来}      # 试过分两次：第 10、15 层压力掉太多，团灭又不是两只一起上造成的
        - {when: every, value: 3, do: effect_all, kind: corrode, turns: 2, label: 镰刃贴地一扫，一股寒气钻进了每个人的伤口}
        - {when: every, value: 4, min_depth: 16, do: combo, target: highest_threat, label: 念起安葬的祷词，坟土从地下翻上来裹住了人, effects: [{kind: restrained, escape: 2, label: 被坟土裹住了}, {kind: corrode, label: 伤口沾上了坟土}, {kind: silence, turns: 2}]}
        - {when: every, value: 5, min_depth: 16, do: telegraph, label: 把镰刀拖在身后，绕着人慢慢转了半圈, then: {do: strike, mult: 1.5, target: all, cover_halves: true, label: 镰刀横着扫过整间墓室}}
        - {when: hp_below, value: 0.5, min_depth: 16, do: phase, label: 一脚踩开了墓穴的石板，阴风卷灭了一半的灯火, env: {light: -10}}
        - {when: every, value: 3, min_depth: 16, phase: true, do: summon, kind: skeleton, count: 1, label: 洞开的墓穴里又爬出一具骷髅兵}

  castle:
    name: 城堡地牢
    light: 50                   # 自然光亮 0~100
    intro: 石阶变成了整齐的方砖，墙上每隔几步就有一个锈蚀的火把架，远处传来铁链拖地的声音，这里曾经关押过什么人，也许现在还关着。
    entry:
      name: 地牢门厅
      light: dim
      description: 一间方正的石厅，正对着一扇厚重的铁门，门上的铆钉已经锈成了红褐色。
      details: >-
        墙上挂着一块铁牌，上面刻的规矩只剩一半能看清："不得与囚犯交谈"。门边摆着一张狱卒的桌子，桌上的油灯早就干了。
    stairs:
      name: 行刑井
      light: dark
      description: 一口方形的井，井边立着一架绞刑台，井壁上的铁梯一直往下伸进黑暗。
      details: >-
        绞索还挂在架子上，随着井底吹上来的风轻轻晃。铁梯的横档有几根已经锈断，要小心落脚。
    treasure:
      name: 狱卒的库房
      light: dim
      description: 一间上了锁又被撬开的小库房，架子上堆着没收来的杂物。
      details: >-
        架子上贴着一张张写着名字的纸条，每个名字下面是一堆东西：一只靴子、一把梳子、一封没拆开的信。大部分都已经烂了。
    rooms:
      - name: 囚室走廊
        light: dim
        description: 一条两侧全是铁栅栏囚室的走廊，栅栏后面黑洞洞的。
        details: 有几间囚室的门开着，里面的镣铐被硬生生扯断了。墙上用指甲刻满了划痕和名字，有一个名字被刻了几十遍。
      - name: 刑讯室
        light: bright
        description: 一间摆满刑具的石室，中间立着一张带皮扣的木椅。
        details: 木椅的扶手上有深深的抓痕。墙上的刑具大多锈住了，只有一把铁钳擦得发亮。地上有一条浅浅的沟，通向墙角的排水口。
      - name: 守卫休息室
        light: bright
        cover: true
        description: 一间摆着长桌和木凳的房间，桌上还放着没吃完的饭菜，早已化成了灰。
        details: 墙上挂着一排生锈的头盔，有一顶上面有个拳头大的凹坑。桌上摊着一副骰子，停在两个一点上。
      - name: 水牢
        light: dark
        ground: water
        description: 一间地势很低的石室，积着齐腰深的脏水，水面上露出几根拴人用的铁柱。
        details: 水冷得刺骨，浑浊得看不见底。铁柱上还挂着断掉的铁链，水面偶尔冒出一串气泡。
      - name: 看守塔底
        light: dim
        cover: true
        description: 一座塔楼的底层，螺旋石阶往上通到一半就塌了，只剩一个空荡荡的圆厅。
        details: 塌下来的石块堆在一边，上面插着一面破烂的旗子，图案已经看不清了。塔壁上开着几道狭窄的射击孔，外面也是石头。
      - name: 典狱长的书房
        light: bright
        cover: true
        description: 一间出人意料地体面的房间，有书架、地毯和一张宽大的书桌。
        details: 书架上的书都被撕掉了封面。书桌上摊着一本册子，上面记着犯人的编号和"已处理"三个字，最后一行的编号被划掉了，旁边写着"它还在下面"。
    # 城堡层地图边上的一间上锁的牢房：典狱长的大钥匙能打开（钥匙留在锁里），里面是这层最好的收获
    cell:
      name: 上锁的牢房
      light: dark
      description: 一间用整块铁板封住的牢房，里面比走廊更冷，角落堆着被没收的财物，像是典狱长私藏的。
      details: >-
        铁门内侧刻满了划痕，是从里面刻的。墙角的草堆早就烂了，旁边却整整齐齐码着几口小箱子，箱盖上贴着典狱长的封条。
        墙上挂着一副空镣铐，锁是开着的。
    features:
      - {name: 刑具架, max_tier: heavy}
      - {name: 墙上的火盆, max_tier: heavy, lamp: true}
      - {name: 垂着的铁链, max_tier: light}
      - {name: 铁栅栏门, max_tier: heavy}
      - {name: 翻倒的木凳, max_tier: light}
    monsters: [jailer, armored_guard, dungeon_hound, jail_crossbowman]
    events: [warden_cellar, prison_records, spring]
    eerie:
      - 某间囚室里传出铁链拖地的声音，拖了三下，停了。
      - 远处有人用指甲在铁栅栏上一根根划过，叮、叮、叮……
      - 一扇铁门在很远的地方被重重关上，回声在走廊里滚了很久。
    boss:
      name: 典狱长
      description: 一个穿着整套黑铁甲的高大身影，头盔的缝隙里透出两点红光，腰间挂着一大串钥匙。
      persona: 冷酷，一板一眼，把闯进来的人都当成越狱的犯人，一边追一边念着罪名。
      on_hit: {kind: restrained, chance: 0.3, label: 被铁链锁住了手脚, escape: 3}
      hp: 1.3
      atk: 25
      def: 10
      immune: [restrained]
      weak: poison
      skills:
        - {when: every, value: 3, do: status_all, kind: restrained, escape: 2, label: 甩出铁链横扫一圈}
        - {when: fight_start, do: mark, bonus: 20, label: 用钥匙串指着人冷冷地宣判：你，有罪}
        - {when: every, value: 4, min_depth: 16, do: combo, target: highest_threat, label: 铁链一甩锁住了人，开始一条一条念罪状, effects: [{kind: restrained, escape: 2, label: 被镣铐锁住了}, {kind: mark, bonus: 20}, {kind: bleed, label: 被铁链勒出了血}]}
        - {when: every, value: 5, min_depth: 16, do: telegraph, label: 举起行刑的大斧，对准了被判罪的人, then: {do: strike, mult: 2.5, target: marked, label: 行刑斧落了下来}}
        - {when: hp_below, value: 0.5, min_depth: 16, do: phase, label: 拽下墙上的铁闸，咣当一声封死了牢门, env: {sealed: true}, actions: 1}

  forest:
    name: 地底森林
    light: 45                   # 自然光亮 0~100
    intro: 石阶尽头竟是一片森林：头顶不是天空，而是望不到边的岩穹，岩缝里垂下发着微光的根须，照着一棵棵在黑暗里长了不知多少年的苍白巨树。
    entry:
      name: 林边石阶
      description: 石阶的最后几级被树根拱得歪歪斜斜，前方是一片苍白的树林，树干上长满发光的苔藓。
      light: dim
      details: >-
        树根从石缝里钻出来，粗得像人的腰。空气潮湿，带着腐叶和某种甜腻花香的味道。
        林子里很安静，安静得听不见一只虫子叫，只有岩穹上偶尔滴下的水珠打在叶子上。
    stairs:
      name: 空心巨树
      description: 一棵巨树的树干中间是空的，树洞里一圈木质的台阶螺旋着往地底更深处延伸。
      light: dark
      details: >-
        树洞内壁光滑，像是被什么东西常年进出磨出来的。台阶是树本身长出来的木瘤，踩上去微微发软。下面吹上来的风带着泥土和更古老的气味。
    treasure:
      name: 猎人的藏身处
      description: 两棵巨树之间搭着一个破旧的木棚，棚下堆着几只蒙着兽皮的箱子。
      light: dim
      cover: true
      details: >-
        木棚的柱子上挂着几串风干的兽骨，像是驱邪用的。箱子上的兽皮已经发硬，有一只被爪子抓开过，又被人用绳子重新绑上了。
    rooms:
      - name: 苍白林道
        light: dim
        cover: true
        description: 一条落满白色落叶的小路在巨树之间蜿蜒，两侧的树干粗得几个人都合抱不过来。
        details: 落叶踩上去没有声音，像踩在灰上。树干上有一道道新鲜的爪痕，离地一人多高。
      - name: 发光的林间空地
        light: bright
        description: 一片开阔的空地，地上长满会发光的蓝色小花，把四周照得亮堂堂的。
        details: 空地中央有一圈倒伏的草，像有什么庞大的东西在这里趴过。花的光一闪一闪，像在呼吸。
      - name: 缠根洼地
        light: dark
        ground: water
        description: 一处低洼的林地，地面被纵横交错的树根和积水占满，每一步都得小心。
        details: 积水黑得发亮，树根在水下盘成一张网，随时可能绊住脚。水面上浮着一层细细的白色孢子。
      - name: 倒木长廊
        light: dim
        cover: true
        description: 几棵倒下的巨树横七竖八地架在一起，形成一条天然的木廊。
        details: 倒木上长满了蘑菇和苔藓，木廊里又暗又闷。有的倒木被掏空了，里面黑洞洞的，像是有什么东西的窝。
      - name: 藤蔓帷幕
        light: dark
        cover: true
        description: 从头顶垂下的藤蔓密得像一道道帘子，要拨开才能往前走。
        details: 藤蔓摸上去冰凉滑腻，有的会轻轻缩一下。帘子后面偶尔传来窸窸窣窣的声音，又很快停了。
      - name: 石像残迹
        light: dim
        description: 林子里立着几尊半埋在树根里的石像，面孔早已被苔藓吞没。
        details: 石像的手都指着同一个方向，那里的树长得格外密。其中一尊的脚下摆着几块新鲜的兽骨，像是供品。
    features:
      - {name: 倒下的枯树, max_tier: heavy}
      - {name: 荆棘丛, max_tier: light}
      - {name: 垂下的藤蔓, max_tier: light}
      - {name: 布满苔藓的大石, max_tier: heavy}
      - {name: 发光的菌灯, max_tier: light, lamp: true}
    monsters: [cave_wolf, thorn_vine, forest_goblin, goblin_hunter]
    events: [tree_hollow_wine, runestone_notes, spring]
    eerie:
      - 远处有什么东西踩断了一根树枝，然后整片林子都安静了下来。
      - 头顶的根须里传来一阵低沉的吱嘎声，像是某棵巨树在翻身。
      - 一只发光的飞虫停在你肩上，又飞走了，它飞去的方向传来一声狼嚎。
    boss:
      name: 古树守卫
      description: 一棵会走路的古树，树皮上长着一张沉睡般的人脸，枝条像手臂一样垂着，每走一步地面都在颤。
      persona: 缓慢而愤怒，把闯进森林的人都当作砍树的贼，枝条抽过来又重又狠。
      on_hit: {kind: prone, chance: 0.35, label: 被枝条抽倒在地}
      hp: 1.6
      deep_hp: 1.1                 # 第 16 层起的血量倍率（默认 1.3，模拟对线调的）
      atk: 5
      def: 10
      immune: [prone]                 # 扎着根，撞不倒
      weak: fire
      skills:
        - {when: every, value: 3, do: status_all, kind: restrained, escape: 2, label: 地下窜出一片藤蔓，缠住了所有人的脚}
        - {when: hp_below, value: 0.5, do: self_heal, heal: 0.2, label: 根须扎得更深，树液顺着裂开的树皮流回伤口}
        - {when: every, value: 4, min_depth: 16, do: combo, target: all, label: 地底翻出一片带毒刺的根须, effects: [{kind: restrained, escape: 2, label: 被毒根缠住了}, {kind: poison, label: 被毒刺扎了}]}
        - {when: every, value: 5, min_depth: 16, do: telegraph, label: 抱住一根枯死的巨木，把它从地里连根拔了起来, then: {do: strike, mult: 2.0, target: all, cover_halves: true, label: 巨木轰隆一声砸下来}}
        - {when: hp_below, value: 0.5, min_depth: 16, do: phase, label: 整个身子往下一沉，根须一路扎进了地底, regen: 0.05}

  swamp:
    name: 蘑菇沼泽
    light: 40                   # 自然光亮 0~100
    intro: 石阶一路往下，渐渐被湿滑的淤泥盖住，眼前是一片泡在黑水里的沼泽，到处长着比人还高的蘑菇，伞盖下发着幽幽的绿光。
    entry:
      name: 沼泽边缘
      description: 石阶没进淤泥里，前方是一片冒着气泡的黑水沼泽，几株巨大的蘑菇撑开伞盖，像一盏盏昏暗的灯。
      light: dim
      ground: water
      details: >-
        空气又闷又潮，带着一股甜腥的霉味，吸久了嗓子发痒。淤泥里半埋着一条腐烂的木栈道，还能勉强下脚。
    stairs:
      name: 蘑菇井
      description: 一株巨大的空心蘑菇倒插在沼泽中央，菌柄里是一条往下的湿滑通道。
      light: dim
      details: >-
        菌柄内壁软得像肉，一按就渗出黏液。通道里挂满发光的菌丝，一直往下延伸，看不到尽头。
    treasure:
      name: 沉没的小屋
      description: 一间陷进沼泽一半的木屋，屋顶上长满了蘑菇，门半开着。
      light: dark
      ground: water
      details: >-
        屋里的水没到膝盖，漂着腐烂的家具。墙角的架子还高出水面，上面摆着几只用蜡封好的罐子和一只小木箱。
    rooms:
      - name: 腐烂的栈道
        light: dim
        ground: water
        description: 一条架在黑水上的木栈道，木板烂了大半，每一步都嘎吱作响。
        details: 栈道下面的水里有东西游过，带起一串气泡。有几块木板已经断了，要跳过去才行。
      - name: 巨菇林
        light: dim
        cover: true
        description: 一片比人还高的蘑菇林，伞盖层层叠叠，把头顶遮得严严实实。
        details: 菌柄上长着一圈圈鳞片，碰一下就落下一阵发光的孢子。蘑菇之间的缝隙窄得只能侧身挤过去。
      - name: 孢子雾地
        light: dark
        description: 一片被浓密孢子雾笼罩的地方，伸手不见五指，只有雾里偶尔亮起一点绿光。
        details: 孢子雾甜得发腻，吸进去脑袋有点发沉。雾里有东西在慢慢移动，看不清是什么。
      - name: 泥沼深处
        light: dark
        ground: water
        description: 泥浆一直没到大腿，每一步都要用力把腿拔出来。
        details: 泥浆里时不时冒出一个大气泡，带着腐臭的味道炸开。泥里好像埋着什么硬东西，踩上去咯脚。
      - name: 萤火洞穴
        light: bright
        description: 一个干燥的小洞穴，洞顶挂满了萤火虫一样发光的小虫，把洞里照得通明。
        details: 这是沼泽里难得干燥的地方，地上有人生过火的痕迹。发光小虫受惊时会一起熄灭，再慢慢亮起来。
      - name: 蘑菇人的村落
        light: dim
        cover: true
        description: 几株蘑菇被掏空做成了小屋，屋前摆着用菌盖做的碗和盘子。
        details: 小屋里空无一人，碗里还盛着冒着热气的黏稠菌汤。屋檐下挂着一串串风干的虫子，像是存粮。
    features:
      - {name: 腐烂的树桩, max_tier: heavy}
      - {name: 发光的毒菇丛, max_tier: light}
      - {name: 淤泥坑, max_tier: heavy}
      - {name: 垂着的湿苔藓, max_tier: light}
      - {name: 挂着的萤虫灯笼, max_tier: light, lamp: true}
    monsters: [bog_toad, myconid, bog_leech, spit_toad]
    events: [witch_hut, sunken_cart, spring]
    eerie:
      - 沼泽深处传来一声沉闷的"咕嘟"，像是有什么很大的东西沉下去了。
      - 几株蘑菇的光同时熄灭，又一株接一株地亮了回来，像在传递什么信号。
      - 雾里有人在轻轻哼一首听不懂的歌，调子忽远忽近。
    boss:
      name: 沼泽女巫
      description: 一个佝偻的老妇人，下半身和一株巨大的蘑菇长在了一起，手里拄着一根挂满骨头的拐杖。
      persona: 阴沉又爱笑，喜欢用甜言蜜语引人走进泥沼深处，发起怒来尖啸着召唤毒雾。
      on_hit: {kind: poison, chance: 0.3, turns: 2, value_mult: 0.6, label: 被毒雾呛得喘不过气}
      hp: 1.0
      atk: 10
      def: 0
      immune: [poison]
      weak: fire
      skills:
        - {when: every, value: 4, do: telegraph, label: 举起骨杖念念有词，绿色的毒雾在她脚下翻涌（下一次出手全场中毒；这一轮狠狠砍她一下能打断）,
           then: {do: effect_all, kind: poison, turns: 2, value_mult: 0.6, label: 毒雾轰地炸开，灌满了整个房间}}
        - {when: hp_below, value: 0.8, do: summon, kind: bog_toad, count: 1, label: 尖叫一声，泥水里拱出了一只巨蟾}
        - {when: every, value: 4, min_depth: 16, do: combo, label: 骨杖一指，一团黑绿色的咒雾扑到脸上, effects: [{kind: poison, label: 吸进了咒雾}, {kind: blind, label: 眼前一片黑绿}, {kind: wound, turns: 3, label: 伤口烂得合不上}]}
        - {when: hp_below, value: 0.5, min_depth: 16, do: phase, label: 尖啸一声，脚下的泥水开始上涨, env: {ground: water}, then: {do: summon, kind: bog_toad, elite: true, count: 1, label: 涨起来的泥水里浮出一只更大的巨蟾}}

  library:
    name: 巨大图书馆
    light: 55                   # 自然光亮 0~100
    intro: 石阶尽头是一扇敞开的铜门，门后的书架一排排延伸进黑暗，高得看不到顶，空气里满是灰尘、旧纸和墨水的味道。
    entry:
      name: 铜门前厅
      description: 一间铺着黑白石砖的前厅，正对着一扇半开的铜门，门上铸着一只睁开的眼睛。
      light: dim
      details: >-
        前厅的墙上刻着一行字："静。书在听。"地上有一层均匀的灰，只有一串脚印从门里走出来，没有走进去的。
    stairs:
      name: 下沉的阅览井
      description: 一口圆形的井，井壁全是书架，一条螺旋的木梯沿着书架往下盘，下面还是书。
      light: dark
      details: >-
        越往下书越老，书脊上的文字也越古怪。梯子上挂着一盏早已熄灭的油灯，风从井底吹上来，翻动着书页。
    treasure:
      name: 馆长的储藏室
      description: 一间上锁的小房间，锁已经被撬坏了，里面堆着没登记的书和杂物。
      light: dim
      cover: true
      details: >-
        房间里堆着成箱的书和几只落满灰的木匣，一张桌上还摊着一本记账本，最后一页写着"遗失：三册。追回：零"。
    rooms:
      - name: 无尽书廊
        light: dark
        cover: true
        description: 两侧的书架高得看不到顶，书廊笔直地伸进黑暗里，看不到尽头。
        details: 有些书的书脊在轻轻颤动，像是在呼吸。偶尔会有一本书自己从架上掉下来，摊开在地上。
      - name: 烛光阅览室
        light: bright
        description: 一间摆满长桌的阅览室，桌上的蜡烛都点着，照得满屋亮堂堂的。
        details: 每张桌上都摊着一本书，翻到同一页。椅子都被拉开了，像是刚刚有一群人起身离开。
      - name: 倒塌的书架区
        light: dim
        cover: true
        description: 一排书架倒了下来，压塌了另外几排，书堆成了一座座小山。
        details: 书山里压着一只手，手指还捏着一支羽毛笔。书架的断口很新，像是刚倒不久。
      - name: 禁书回廊
        light: dark
        description: 一条被铁链封住的回廊，书架上的书都用锁扣锁着，锁扣上刻着警告。
        details: 有几本书的锁扣断了，书页上的字在黑暗里微微发光。走过的时候能听见书在低声说话。
      - name: 星图穹厅
        light: dim
        description: 一间圆形的大厅，穹顶上画满了星图，地板上刻着一个巨大的圆形法阵。
        details: 法阵的线条里嵌着银丝，有几处已经断了。星图上的星星一闪一闪，和外面的天空都对不上。
      - name: 抄写室
        light: dim
        cover: true
        description: 一间摆满斜面书桌的房间，桌上堆着没写完的手稿和干掉的墨水瓶。
        details: 所有的手稿都写着同一段话，一遍又一遍，字迹越到后面越潦草。墙角的墨水桶里的墨水还是湿的。
    features:
      - {name: 摇晃的书架, max_tier: heavy}
      - {name: 燃着的烛台, max_tier: light, lamp: true}
      - {name: 带轮子的滚梯, max_tier: heavy}
      - {name: 成堆的厚书, max_tier: light}
      - {name: 翻倒的墨水桶, max_tier: light}
    monsters: [animated_tome, ink_shade, stone_gargoyle, ink_scribe]
    events: [forbidden_shelf, scholar_cellar, meteor_paperweight]
    eerie:
      - 远处的书架间传来一声清晰的"嘘——"，然后再没有声音。
      - 一本书从身后的架子上掉下来，摊开的那一页上写着你的名字。
      - 某处传来翻书的沙沙声，翻得越来越快，然后戛然而止。
    boss:
      name: 馆长的幽灵
      description: 一个披着长袍的半透明老人，眼眶里是两团墨水般的黑暗，身边环绕着飞舞的书页。
      persona: 严厉又偏执，认定每个闯进来的人都是偷书贼，一边念着馆规一边用书页割人。
      on_hit: {kind: blind, chance: 0.35, label: 被飞舞的书页遮住了视线}
      hp: 1.3
      deep_hp: 1.1                 # 第 16 层起的血量倍率（默认 1.3，模拟对线调的）
      atk: 20
      def: 10
      immune: [poison, bleed]         # 幽灵，毒和血口子都没用
      weak: light                     # 怕光：光亮 70 以上打它伤害 ×1.5
      skills:
        - {when: every, value: 4, do: silence, turns: 2, label: 竖起一根手指「嘘——」，书页和卷轴上的字一下子全暗了}
        - {when: hp_below, value: 0.5, do: summon, kind: animated_tome, count: 2, label: 一挥手，书架上扑棱棱飞下来两本书}      # 两本一起没有爆发（团灭 2%），分开第 10、15 层只剩 30%
        - {when: every, value: 4, min_depth: 16, do: combo, target: all, label: 书页像雪片一样扑过来，每一页上都写着罚抄的字, effects: [{kind: silence, turns: 2}, {kind: blind, label: 被书页糊住了眼睛}, {kind: bleed, label: 被纸边割开了口子}]}
        - {when: every, value: 5, min_depth: 16, do: telegraph, label: 抽出一本烧着蓝火的书，高高举过头顶, then: {do: strike, mult: 1.5, target: all, cover_halves: true, label: 蓝色的火舌卷过整排书架}}
        - {when: hp_below, value: 0.5, min_depth: 16, do: phase, label: 吹了一口气，馆里的灯一盏接一盏灭了, env: {light: -25}}

  forge:
    name: 地底熔炉
    light: 60                   # 熔岩照着，自然光亮偏高：钱掉得少一点，这是这里的代价
    min_depth: 16               # 第 16 层起才进主题池（dungeon._pick_theme）
    heat:                       # 灼热：这一层每做一个动作（说话、看不算）掉血量上限的 pct（不看防御，最少 1 点；engine._heat）
      pct: 0.01
      free: [say, talk, look, reject]     # 不算动作、不掉血的
    fixed_events: {cooling_cistern: 2}     # 每层固定刷两间冷却水池（泉水房）
    intro: 石阶越往下越烫，空气里满是铁锈和硫磺的味道，远处传来一下一下沉闷的锤声，像是有什么东西几千年来一直没停过手。
    entry:
      name: 熔炉之门
      light: bright
      description: 一扇两人多高的青铜大门半开着，门缝里透出橘红色的光，热浪一阵一阵往外涌。
      details: >-
        门板上铸着一排排矮人的锻造纹，有些地方被烤得发黑。门槛下的石缝里淌着一线暗红的铁水，
        早就凝成了一条弯弯曲曲的铁痕。越往里走，脚底下的石头越烫。
    stairs:
      name: 铁水瀑布旁的阶梯
      light: bright
      description: 一道铁水从高处的槽口倾泻下来，落进看不见底的深坑，旁边凿着一条窄窄的石阶往下盘。
      details: >-
        铁水落下的地方溅起一片火星，照得整面岩壁忽明忽暗。石阶被烤得发烫，扶手是一根一根嵌进岩壁的铁环，
        摸上去要隔着袖子。往下看，深处还有更亮的光。
    treasure:
      name: 王室宝库
      light: dim
      cover: true
      description: 一间用整块黑石凿出来的石室，墙上一格一格的石龛里摆着落满灰的东西。
      details: >-
        石龛上刻着每一件东西的名字，大多已经空了。地上倒着一尊只剩半截的矮人石像，手还指着最里面那一格。
        角落里有几只包铁的箱子，锁早就被烤化了。
    rooms:
      - name: 熔岩河畔的长廊
        light: bright
        description: 一条沿着熔岩河修的石廊，河面翻着气泡，热得让人睁不开眼。
        details: 石廊的栏杆早就塌了大半，剩下的几截被烤得发红。河对岸能看到一排排空着的炉口，像一张张张开的嘴。
      - name: 傀儡装配间
        light: dim
        cover: true
        description: 一间摆满了半成品傀儡的工坊，铁架上吊着没装好的手臂和躯干。
        details: 地上散落着铆钉和熔渣，墙上钉着一张画满了傀儡图样的皮纸。有一具傀儡的胸口还嵌着一块微微发红的炉芯，像在呼吸。
      - name: 铁砧广场
        light: bright
        cover: true
        description: 一片开阔的石地上立着几十座铁砧，每座都有半人高，上面还留着没打完的东西。
        details: 铁砧之间的地面被锤出了一个个浅坑。有几座铁砧旁边还靠着锻锤，锤柄上的皮条早就烂光了，锤头却一点锈都没有。
      - name: 铸币坊
        light: dim
        description: 一间低矮的石室，墙边一排石模子里还嵌着没倒出来的金属圆饼。
        details: 模子上的花纹是一顶王冠和一把锤子。地上撒着一些铸坏了的古币，边缘熔得歪歪扭扭，踩上去咯吱作响。
      - name: 坍塌的风箱室
        light: dark
        description: 一只比房子还大的皮风箱塌在石室中央，破口里还时不时往外漏出一股热风。
        details: 风箱的木架子断成了几截，拉绳垂在地上。每隔一阵，深处就传来一声长长的喘息，风箱跟着鼓一下，又瘪下去。
      - name: 矮人的宿舍
        light: dim
        cover: true
        description: 一排排凿进岩壁的石床，床上铺着早已发硬的毛毡。
        details: 每张床头都刻着一个名字，有几张床上还摆着没带走的酒杯和烟斗。最里面那张床的墙上刻满了划痕，数到后来就乱了。
    features:
      - {name: 悬吊的铁水桶, max_tier: heavy}
      - {name: 烧红的铁砧, max_tier: heavy}
      - {name: 蒸汽阀门, max_tier: heavy}
      - {name: 堆成山的熔渣, max_tier: light}
      - {name: 断掉的传送链, max_tier: light}
    traps:                      # 本主题的陷阱描写，没写的主题用全局的 traps
      - 脚下一块铁板突然翻开，底下是一槽冒着热气的铁水
      - 墙上的管道咔的一声，喷出一股滚烫的蒸汽
      - 一排地砖被烧得通红，踩上去才发现鞋底在冒烟
    monsters: [slag_golem, fire_salamander, dwarf_smith_shade, forge_wisp, bellows_worker]
    events: [unquenched_forge, orichalcum_seam, lava_bridge]
    eerie:
      - 远处的锤声忽然停了，过了很久，又一下一下响了起来。
      - 熔岩河里浮上来一个巨大的气泡，破开的时候，像是有人叹了口气。
      - 一阵热风从背后吹过，带着一股烧焦的头发味。
    boss:
      name: 矮人王的铸像
      description: 一尊三人高的青铜铸像，是一位戴着王冠的矮人，手里拄着一柄比人还高的锻锤。胸口开着一扇小小的炉门，里面的火一直没灭过。
      persona: 它是按矮人王的样子铸的，也继承了他最后一道命令：守住熔炉，谁也不许把火带走。它不说话，只是一锤接一锤地砸，像在打一块永远打不完的铁。
      hp: 1.3
      atk: 10
      def: 20
      immune: [bleed, poison, restrained]
      resist_element: [fire]
      weak: water               # 熔化状态时被泼泉水：淬火裂开（quench）
      stances:                  # 每出手 every 次在两种状态之间切换，开场是冷却（engine._stance）
        every: 3
        start: cold
        cold:   {def: 40, atk: -20, label: 身上的红光一点点褪去，青铜又变得冰冷坚硬}
        molten: {def: -20, atk: 20, label: 胸口炉门里的火猛地窜高，表面开始发红、软化，每一锤都带着铁水}
      quench:                   # 熔化状态时往它身上泼泉水：这一瓶泉水用掉
        label: 泉水泼在烧红的青铜上，嗤的一声腾起白雾，铸像身上裂开了一道口子
        then_stance: cold       # 裂开到它下一次出手：防御归零、挨的伤害 ×1.5，这一次出手跳过
      skills:
        - {when: every, value: 4, do: telegraph, label: 把锻锤高高举起，锤头一点点烧红（下一次出手砸向打它最狠的人）,
           then: {do: strike, mult: 2.5, target: highest_threat}}
        - {when: every, value: 3, do: combo, target: all, label: 一脚踏碎熔渣槽，铁水溅了一地,
           effects: [{kind: corrode}, {kind: prone}]}
        - {when: hp_below, value: 0.5, do: phase, label: 胸口的炉门轰然打开，热浪扑面而来,
           env: {light: 30, heat_mult: 2}, then: {do: summon, kind: slag_golem, count: 1}}

# 传送石：打完头目（每 BOSS_EVERY 层）之后下一层的入口。摸一下能回到酒馆地窖；到过这里的人以后能从地窖直接传送过来
stone:
  name: 传送石
  description: 一间圆形的石室，正中立着一块一人多高的灰白巨石，表面刻满发光的纹路，像在缓缓呼吸。
  details: >-
    巨石的纹路里流着淡淡的银光，靠近能感到一股温和的暖意，这是这片黑暗里少有的安全的地方。石室四壁干干净净，没有怪物来过的痕迹。
    巨石底座上刻着一行和地窖石碑一样的古老文字："行至此者，可归，可返"。把手按上去，就能回到地面（说"回城"或"使用传送石"）；
    到过这里的人，以后在地窖里说"传送到第几层"（对着石碑说也行）就能直接传送到这一层。
  light: bright

events:
  cooling_cistern:             # 地底熔炉每层固定两间（fixed_events），就是这个主题的泉水房
    name: 冷却水池
    light: dim
    description: 一方用黑石砌成的大水池，池边立着几只矮人淬火用的长柄铁勺，池水竟然还是凉的。
    details: 水面上浮着一层薄薄的铁锈，底下却清得见底。墙上刻着一行矮人文字，旁边有人用炭笔歪歪扭扭地译了出来："先淬火，再干活"。
    take: {name: 水池, item: spring_water, where: 里}
  unquenched_forge:
    name: 未熄的锻炉
    light: bright
    description: 一座小锻炉里的炭火居然还没灭，旁边的铁砧上摆着一把磨得发亮的锻锤。
    details: 炉火烧得正旺，像是有人刚离开不久。铁砧上刻着一圈矮人的锻造纹，照着纹路敲，也许能把手里的兵器再打磨一番。火星迸得很凶，手上得稳。
    take: {name: 锻炉, service: free_upgrade, where: 上, skill: sleight, difficulty: 2, fail: 火星迸进了袖口，烫得人直甩手, fail_damage: 40}
    # service: free_upgrade：成功就给手上的主武器免费升一级（满级了就改成给一份碎铁；engine._take_from）
  orichalcum_seam:
    name: 奥利哈刚矿脉
    light: bright
    description: 一面被熔岩烤裂的岩壁里露出一条青灰色的矿脉，比上面矿坑里见过的都要粗。
    details: 矿脉被烤得微微发红，敲下来的碎块还是烫的。岩缝里时不时喷出一股热气，挖的时候得看准时机。
    take: {name: 矿脉, item: ore, where: 里, skill: athletics, difficulty: 2, bonus_gem: 0.5, fail: 一股热蒸汽从矿脉缝里喷了出来, fail_damage: 40}
    # bonus_gem：成功时另有这个几率多掉一颗本主题的宝石
  lava_bridge:
    name: 熔岩吊桥
    light: bright
    description: 一条铁链吊桥横跨在熔岩河上，对岸的石台上摆着一只铜匣。
    details: 吊桥只剩几块木板，大半是光秃秃的铁链，踩上去晃得厉害。桥下的熔岩翻着泡，热浪一阵一阵往上冲。铜匣上刻着和熔炉之门一样的锻造纹。
    take: {name: 石台, item: forge_rubbing, where: 上, skill: athletics, difficulty: 2, fail: 铁链一晃，脚下踩空，被熔岩的热浪燎了一下, fail_damage: 60}
  ore_vein:
    name: 裸露的矿脉
    light: dim
    description: 一面岩壁被塌方剥开，露出一条闪着暗光的矿脉，旁边丢着一把还能用的旧镐。
    details: 矿脉里嵌着拳头大的矿石，泛着青灰色的金属光泽，敲一下声音清亮。岩壁上方的石头有些松，挖的时候得小心。
    take: {name: 矿脉, item: ore, where: 里, skill: athletics, difficulty: 2, fail: 一块松石从头顶崩下来，砸在了手上, fail_damage: 20}
  spring:
    name: 地下泉眼
    light: dim
    description: 岩缝里汩汩冒出一股清泉，在地上积成一汪小小的水潭，水清得能看见底。
    details: 泉水冰凉，带着一点点甜味。水潭边长着一圈发着微光的青苔，是这片黑暗里唯一干净的东西。旁边有人留下了几只空陶瓶。
    take: {name: 泉眼, item: spring_water, where: 里}
  miner_cache:
    name: 矿工的藏物处
    light: dark
    description: 一处被木板挡住的凹洞，木板上用炭画着一个矿工行会的标记。
    details: 木板后面藏着一只油布包，包里是矿工们存下的一点家当。凹洞边缘写着一行小字："给后来的兄弟"。
    take: {name: 油布包, item: ore, where: 里, skill: investigation, difficulty: 1, fail: 翻了半天只摸到一手煤灰}
  offering_wine:
    name: 祭酒台
    light: dim
    description: 一座低矮的石台，上面摆着几只封着泥的陶罐，是当年献给死者的祭酒。
    details: 陶罐上的封泥大多完好，有几只已经裂了缝，散出酸败的气味。石台上刻着一行字："饮者须敬"。要挑出一罐没坏的，得懂点门道。
    take: {name: 祭酒台, item: ancient_wine, where: 上, skill: nature, difficulty: 2, fail: 撬开的那罐早就酸成了醋，呛得人直咳嗽, fail_damage: 10}
  tomb_notes:
    name: 墓主的书房
    light: dark
    description: 一间小小的墓室，四壁都是石架，架上堆满了发霉的卷轴和书册。
    details: 大部分书一碰就碎成了渣，只有几本用皮绳捆着、封在蜡里的还完好。要从这堆废纸里找出值得带走的，得有耐心和眼力。
    take: {name: 石架, item: old_tome, where: 上, skill: investigation, difficulty: 2, fail: 翻开的几本一碰就碎了}
  warden_cellar:
    name: 典狱长的私藏
    light: dim
    description: 一间藏在书架后面的小酒窖，架子上躺着几瓶落满灰的酒。
    details: 酒瓶上的标签写着年份，最老的一瓶比这座城堡还老。有几瓶的软木塞已经朽了，里面的酒多半坏了。
    take: {name: 酒架, item: ancient_wine, where: 上, skill: nature, difficulty: 2, fail: 拔开塞子，一股霉味冲出来，这瓶早坏了}
  prison_records:
    name: 档案室
    light: dim
    cover: true
    description: 一间堆满卷宗的石室，墙边立着几只上了锁的铁柜。
    details: 地上散落着被撕碎的卷宗，铁柜的锁大多锈死了，只有一只能撬开。柜子里据说收着典狱长没收来的古书。
    take: {name: 铁柜, item: old_tome, where: 里, skill: sleight, difficulty: 2, fail: 铁丝在锁眼里断了，还划破了手指, fail_damage: 10}

  tree_hollow_wine:
    name: 老树洞
    light: dim
    cover: true
    description: 一棵巨树的根部有个树洞，洞口被人用石头垒过，里面塞着几只陶罐。
    details: 陶罐用树胶封着口，罐身上刻着猎人的记号。有的罐子被树根挤裂了，里面的酒早就渗干了，要挑出一罐还好的。
    take: {name: 树洞, item: ancient_wine, where: 里, skill: nature, difficulty: 2, fail: 罐子里只剩一层发霉的酒渣, fail_damage: 0}
  runestone_notes:
    name: 刻字的石台
    light: dim
    description: 一座被树根缠住的石台，台面上压着一个用油布包好的包裹。
    details: 包裹被树根勒得死紧，要小心解开才不会扯坏里面的东西。石台上的刻字和地窖石碑上的像是同一种文字。
    take: {name: 石台, item: old_tome, where: 上, skill: sleight, difficulty: 2, fail: 一扯，油布包里的书页撕开了一道口子，只好先放下}
  witch_hut:
    name: 女巫的小屋
    light: dim
    cover: true
    description: 一株空心蘑菇里布置成了小屋，挂满了风干的草药和骨头，角落堆着几本书。
    details: 书上压着几块刻着符文的骨头，像是某种封印。随便乱翻，封印可能会咬人。
    take: {name: 书堆, item: old_tome, where: 里, skill: investigation, difficulty: 2, fail: 碰到了一块刻着符文的骨头，手上被烫出一道红印, fail_damage: 20}
  sunken_cart:
    name: 陷进泥里的矿车
    light: dim
    ground: water
    description: 一辆翻倒的矿车半陷在泥浆里，车斗里的矿石撒了一地，大多沉进了泥里。
    details: 泥浆很深，要把矿石捞出来得费不少力气，一不小心就会整个人陷进去。
    take: {name: 泥浆, item: ore, where: 里, skill: athletics, difficulty: 2, fail: 一脚踩空陷进泥里，费了好大劲才爬出来, fail_damage: 10}
  forbidden_shelf:
    name: 半开的禁书架
    light: dark
    description: 一排被铁链锁住的书架，其中一格的锁已经锈断了，露出几本古老的书。
    details: 书架上的书有的会自己合上，有的封面上长着眼睛一样的花纹。要从里面挑出一本安全又值钱的，得有眼力。
    take: {name: 禁书架, item: old_tome, where: 上, skill: investigation, difficulty: 3, fail: 抽出的那本书猛地合上，夹破了手指, fail_damage: 20}
  scholar_cellar:
    name: 学者的私藏
    light: dim
    cover: true
    description: 一排书架后面藏着一个小隔间，里面摆着几瓶落满灰的酒和一只酒杯。
    details: 看来有学者喜欢边看书边喝酒。酒瓶上贴着手写的标签，写着年份和评价，有几瓶的评价是"别喝"。
    take: {name: 酒架, item: ancient_wine, where: 上, skill: nature, difficulty: 2, fail: 拔开塞子才发现是标着"别喝"的那瓶，赶紧塞了回去}
  meteor_paperweight:
    name: 天文学家的书桌
    light: bright
    description: 一张摆满星盘和仪器的书桌，桌上压着一块黑沉沉的陨铁镇纸。
    details: 陨铁被固定在一个黄铜机关上，拿起来之前得先解开机关的卡扣，不然会触发什么。
    take: {name: 书桌, item: ore, where: 上, skill: sleight, difficulty: 2, fail: 机关弹出一根细针，扎进了手背, fail_damage: 20}

# 走路时的陷阱（每个主题都可能碰上）
traps:
  - 脚下一块石板一沉，墙缝里射出一排锈针
  - 一根几乎看不见的绊索，连着头顶一块松动的石头
  - 地面突然塌下去一小块，底下插着削尖的木桩
  - 墙上的机关咔哒一响，一把生锈的刀片横扫过来

monsters:
  slag_golem:
    name: 熔渣傀儡
    description: 一具用熔渣和铁板胡乱拼起来的人形，胸口嵌着一块还在发红的炉芯，每走一步都往下掉火星。
    persona: 没有意识，只会重复几千年前的命令：把挡路的东西搬走。被打了也不停，一直往前推。
    hp: 1.4
    atk: 0
    def: 30
    perception: -1
    immune: [bleed, poison]
    resist_element: [fire]      # 火属性（余烬石、火油箭、点燃的火把）对它不算弱点
    weak: pierce
    on_hit: {kind: prone, chance: 0.25, label: 被傀儡一把推翻在地}
  fire_salamander:
    name: 火蜥蜴
    description: 一条比人还长的红皮蜥蜴，背上的鳞片像烧透的炭，爬过的地方留下一道焦痕。
    persona: 喜欢趴在熔岩边上晒热，闻到生人的气味就昂起头，一口咬住不放。
    hp: 0.8
    atk: 10
    animal: true
    perception: 1
    resist_element: [fire]
    on_hit: {kind: corrode, chance: 0.3, label: 被烫得发红的牙咬穿了护甲}
  dwarf_smith_shade:
    name: 矮人亡魂铁匠
    description: 一个半透明的矮壮身影，系着一条烧焦的皮围裙，手里的锻锤却是实实在在的铁。
    persona: 还以为自己在干活，嘴里念叨着"火候、火候"。谁挡在铁砧前面，就把谁当成一块要打的铁。
    undead: true
    hp: 1.0
    atk: 10
    def: 10
    on_hit: {kind: prone, chance: 0.2, label: 被铁锤砸得跪倒在地}
  forge_wisp:
    name: 炉火精
    description: 一团飘在半空的火焰，火苗里隐约有一张咧嘴笑的脸，身后拖着一串熔渣。
    persona: 淘气又恶毒，躲在熔岩河对岸往人身上甩熔渣，被泼水就尖叫着缩成一团。
    hp: 0.6
    atk: 10
    ranged: true
    verb: 甩出一团烧红的熔渣
    resist_element: [fire]
    weak: water
    on_hit: {kind: corrode, chance: 0.2, label: 熔渣粘在护甲上烧出一个洞}
  bellows_worker:
    name: 风箱工
    description: 一个佝偻的矮人亡魂，背上绑着一只破风箱，走到哪都呼哧呼哧地拉着。
    persona: 不打人，只顾着给傀儡"回炉"：风箱一拉，傀儡身上的裂缝就又烧合了。
    undead: true
    hp: 0.8
    atk: -10
    ranged: true
    healer: 0.25
    verb: 拉了一下风箱，一股热风扑了过来
  # 远程的怪（ranged: true）：不主动靠近，离人一步以上就射；被贴身了先往后跳开（这一下不射），
  #   除非这一轮刚被这个人贴身砍中（被缠住了），那就只能贴身硬射。有掩体的房间射得没那么准。verb 是出手的说法
  # 治疗的怪（healer: 比例）：有同伴掉到六成血以下，这一下给伤得最重的那个回这么多血，不打人
  # guard_allies：打向它身后同伴的近战攻击，这么大几率被它挡下（落在它身上）；同伴都倒下它就扔下挡板逃跑。
