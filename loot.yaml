# 地牢掉落表：怪身上带什么、宝箱房抽什么、头目掉什么、宝石规则（dungeon.loot_data 读，deep_loot.yaml 补充深层的）
#   chance    0~1，每次单独掷
#   min_floor 低于这层不掉
#   weight    池子里按权重抽一件
# 怪物、主题的 key 和 dungeon.yaml 一致；物品 key 在 items_dungeon.yaml 和 world.yaml 里

rules:
  elite_mult: 3              # 精英怪的专属掉率 × 3
  elite_pool_chance: 0.05    # 精英另外有这个几率从通用池抽一件
  boss_upgrade_every: 5      # 头目每深 5 层，招牌装备自带 +1（10 层 +1，15 层 +2），套莉娜的升级等级
  treasure_item_chance: 0.4  # 宝箱房除了钱袋，再有这个几率出一件物品
  treasure_theme_share: 0.5  # 宝箱房的物品一半从本主题池抽，一半从通用池抽

# 普通怪的专属掉落
monsters:
  cave_rat: []
  kobold_slinger:
    - {item: sling, chance: 0.08}
    - {item: lead_shot, chance: 0.2}
  kobold_shieldbearer:
    - {item: beetle_shell_shield, chance: 0.05}
  skeleton_archer:
    - {item: bone_bow, chance: 0.05, min_floor: 3}
  grave_nun: []
  jail_crossbowman:
    - {item: grapple_bolt, chance: 0.15}
    - {item: hand_crossbow, chance: 0.05}
    - {item: tower_shield, chance: 0.05, min_floor: 3}
    - {item: heavy_crossbow, chance: 0.03, min_floor: 7}
  goblin_hunter:
    - {item: hunting_bow, chance: 0.06, min_floor: 2}
    - {item: fire_arrow, chance: 0.15}
    - {item: quiver_belt, chance: 0.04, min_floor: 3}
  spit_toad: []
  ink_scribe: []
  kobold:
    - {item: miner_pick, chance: 0.06}
    - {item: kobold_cap, chance: 0.08}
  rock_beetle:
    - {item: beetle_shell_shield, chance: 0.05, min_floor: 4}
  skeleton:
    - {item: silver_dagger, chance: 0.04, min_floor: 2}
  ghoul:
    - {item: silver_dagger, chance: 0.04, min_floor: 2}
    - {item: mourner_ring, chance: 0.04, min_floor: 4}
    - {item: grave_lantern, chance: 0.03, min_floor: 3}
  wisp: []
  jailer:
    - {item: iron_baton, chance: 0.06}
    - {item: jailer_keyring, chance: 0.05, min_floor: 2}
  armored_guard:
    - {item: chain_mail, chance: 0.05}
    - {item: iron_shield, chance: 0.05}
  dungeon_hound:
    - {item: hound_collar, chance: 0.05, min_floor: 3}
  cave_wolf:
    - {item: wolf_hide_boots, chance: 0.05, min_floor: 2}
  thorn_vine:
    - {item: thorn_whip, chance: 0.05, min_floor: 3}
  forest_goblin:
    - {item: bone_spear, chance: 0.06}
  bog_toad:
    - {item: marsh_boots, chance: 0.05}
  myconid:
    - {item: venom_bone_knife, chance: 0.05, min_floor: 2}
    - {item: glowcap_staff, chance: 0.04, min_floor: 3}
  bog_leech:
    - {item: venom_bone_knife, chance: 0.05, min_floor: 2}
  animated_tome:
    - {item: paper_ward, chance: 0.05, min_floor: 2}
  ink_shade:
    - {item: ink_blade, chance: 0.04, min_floor: 4}
  stone_gargoyle:
    - {item: gargoyle_eye, chance: 0.04, min_floor: 4}

# 头目：二选一必掉
bosses:
  mine:      {pick_one: [foreman_mattock, foreman_plate]}
  graveyard: {pick_one: [keeper_scythe, keeper_heartstone]}
  castle:    {pick_one: [warden_helm, warden_key], extra: [{item: iron_shield, chance: 0.3}]}
  forest:    {pick_one: [elder_bark_armor, heartwood_amulet]}
  swamp:     {pick_one: [witch_bone_ring, witch_staff]}
  library:   {pick_one: [curator_monocle, curator_ledger]}

# 通用池：精英的额外掉落、宝箱房的一半从这里抽
# 楼梯间守卫（精英）保底掉一件：身上的专属掉落一件都没掷中时，从这里抽。补给为主，不给好装备（保底只是不让人空手，不该比专属掉落还好）
stair_guard:
  - {item: bandage,        weight: 10}
  - {item: herb,           weight: 10}
  - {item: antidote_moss,  weight: 8}
  - {item: lamp_oil,       weight: 8}
  - {item: whetstone,      weight: 8}
  - {item: torch,          weight: 6}
  - {item: blood_potion,   weight: 6, min_floor: 3}
  - {item: map_scrap,      weight: 5, min_floor: 2}
  - {item: recall_crystal, weight: 3, min_floor: 4}
  - {item: smoke_bomb,     weight: 5, min_floor: 3}
  - {item: grapple_bolt,   weight: 4, min_floor: 4}
  - {item: fire_arrow,     weight: 4}
  - {item: lead_shot,      weight: 4}

