# 宝箱房的主题池
treasure:
  forge:
    - {item: dwarf_hand_axe, weight: 8}
    - {item: dwarf_warhammer, weight: 6}
    - {item: dwarf_bulwark, weight: 6}
    - {item: forge_rubbing, weight: 4}
  mine:
    - {item: miner_lamp, weight: 12, min_floor: 3}
    - {item: miner_pick, weight: 8}
  graveyard:
    - {item: silver_dagger, weight: 10, min_floor: 2}
    - {item: grave_lantern, weight: 10, min_floor: 3}
    - {item: holy_water, weight: 15}
  castle:
    - {item: chain_mail, weight: 8}
    - {item: iron_shield, weight: 8}
    - {item: jailer_keyring, weight: 8, min_floor: 2}
  forest:
    - {item: wolf_hide_boots, weight: 8, min_floor: 2}
    - {item: thorn_whip, weight: 6, min_floor: 3}
  swamp:
    - {item: glowcap_staff, weight: 8, min_floor: 3}
    - {item: venom_bone_knife, weight: 8, min_floor: 2}
  library:
    - {item: light_scroll, weight: 12}
    - {item: paper_ward, weight: 8, min_floor: 2}

# 路边小木匣：在现有的面包、药草、火把、麻绳之外再加
road_box:
  all:
    - {item: bandage, chance: 0.2}
    - {item: lamp_oil, chance: 0.15}
    - {item: whetstone, chance: 0.1}
    - {item: map_scrap, chance: 0.1, min_floor: 2}
  graveyard:
    - {item: holy_water, chance: 0.15}
  library:
    - {item: light_scroll, chance: 0.1}

# 空房搜索：沿用 forage 的写法，加在对应主题上
forage:
  forest:
    - {item: wild_berries, chance: 0.4}
  swamp:
    - {item: antidote_moss, chance: 0.3}
    - {item: marsh_mushroom, chance: 0.5}

# ============ 宝石（第一期）============
gems:
  sockets:                     # 掉落时按稀有度随机孔数，权重依次对应 0/1/2/3 个孔（只有武器、护具、饰品带孔）
    common:   [70, 30, 0, 0]   # 普通怪身上的
    uncommon: [30, 50, 20, 0]  # 精英身上的、宝箱房的、楼梯间守卫保底的
    rare:     [0, 40, 40, 20]  # 头目掉的
  tier_by_floor:               # 掉落时的品质权重：碎裂 / 普通 / 闪亮 / 完美（取不超过这一层的最大那一档）
    1:  [90, 10, 0, 0]
    5:  [60, 35, 5, 0]
    10: [30, 50, 17, 3]
    15: [10, 45, 30, 15]
    20: [5, 35, 35, 25]
  numeric_perfect_min_floor: 15   # numeric 的宝石低于这层时，完美降成闪亮
  unsocket_fee: [10, 30, 60, 120] # 取出费用：碎裂 / 普通 / 闪亮 / 完美
  tier_price: [15, 40, 80, 200]   # 参考价
  body_caps: {defense: 20, max_hp: 60}
  refine:                      # 诺艾尔刷品质（宝石得是没镶在装备上的）：只升不降
    up_chance: [0.5, 0.25, 0.10]  # 从碎裂、普通、闪亮各升一档的几率
    double_up_chance: 0.05        # 每次另有这么多几率直接跳两档（封顶完美）
    cost: [20, 60, 150]
    catalyst_mult: 2              # 交一颗同种宝石当垫子，这次升档几率翻倍，垫子用掉
    min_deepest_floor: {shiny: 10, perfect_numeric: 15, perfect_other: 10}   # 最深到过第几层才刷得出这一档
  drops:
    normal: 0.015              # 普通怪，从本主题的宝石里抽
    elite: 0.08
    boss: 1.0                  # 头目必掉一颗，本主题池
    treasure: 0.2              # 宝箱房额外 20% 出一颗，一半本主题、一半通用
    mining: 0.3                # 挖矿成功额外 30% 出一颗，从矿坑池或通用池抽
    deep_from_floor: 15        # 深层多掉：从这一层起普通怪、精英、宝箱房的宝石掉率 ×deep_mult，头目掉 boss_deep 颗
    deep_mult: 2
    boss_deep: 2
  pools:
    mine: [bloodstone, rockvein_stone]
    graveyard: [silver_vein, frost_jade, cats_eye]
    castle: [ironheart_stone, staunch_stone, sunder_stone]
    forest: [ember_stone, rootbind_stone]
    swamp: [venom_crystal, mossvein_stone]
    library: [inkward_opal, glowstone, keen_ink]
    forge: [bloodstone, sunder_stone, ironheart_stone]     # 熔炉里余烬石没用，换成破甲和数值
    common: [prism_shard, vigor_garnet, bloodstone]
