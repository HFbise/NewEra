  - {item: hunting_bow,      weight: 5,  min_floor: 4}
  - {item: tower_shield,     weight: 4,  min_floor: 5}
  - {item: heavy_crossbow,   weight: 2,  min_floor: 9}
  - {item: steel_shortsword, weight: 10, min_floor: 5}
  - {item: war_hammer,       weight: 4,  min_floor: 8}
  - {item: vigor_ring,       weight: 5,  min_floor: 6}
  - {item: lucky_coin,       weight: 3,  min_floor: 4}
  - {item: map_scrap,        weight: 8,  min_floor: 2}
  - {item: flail_chain,      weight: 6,  min_floor: 3}
  - {item: quake_axe,        weight: 3,  min_floor: 9}
  - {item: storm_rod,        weight: 5,  min_floor: 5}
  - {item: bat_fang_dagger,  weight: 5,  min_floor: 4}
  - {item: executioner_blade, weight: 3, min_floor: 10}
  - {item: ambush_knife,     weight: 6,  min_floor: 3}
  - {item: frost_blade,      weight: 5,  min_floor: 5}
  - {item: soul_reaper,      weight: 5,  min_floor: 5}
  - {item: avenger_blade,    weight: 4,  min_floor: 6}
