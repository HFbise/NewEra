# 宝箱房的主题池
treasure:
  mine:
    - {item: miner_lamp, weight: 12, min_floor: 3}
    - {item: miner_pick, weight: 8}
  graveyard:
    - {item: silver_dagger, weight: 10, min_floor: 2}
    - {item: grave_lantern, weight: 10, min_floor: 3}
    - {item: holy_water, weight: 15}
  castle:
    - {item: chain_mail, weight: 8}
    - {item: iron_shield, weight: 8}
    - {item: jailer_keyring, weight: 8, min_floor: 2}
  forest:
    - {item: wolf_hide_boots, weight: 8, min_floor: 2}
    - {item: thorn_whip, weight: 6, min_floor: 3}
  swamp:
    - {item: glowcap_staff, weight: 8, min_floor: 3}
    - {item: venom_bone_knife, weight: 8, min_floor: 2}
  library:
    - {item: light_scroll, weight: 12}
    - {item: paper_ward, weight: 8, min_floor: 2}

# 路边小木匣：在现有的面包、药草、火把、麻绳之外再加
road_box:
  all:
    - {item: bandage, chance: 0.2}
    - {item: lamp_oil, chance: 0.15}
    - {item: whetstone, chance: 0.1}
    - {item: map_scrap, chance: 0.1, min_floor: 2}
  graveyard:
    - {item: holy_water, chance: 0.15}
  library:
    - {item: light_scroll, chance: 0.1}

# 空房搜索：沿用 forage 的写法，加在对应主题上
forage:
  forest:
    - {item: wild_berries, chance: 0.4}
  swamp:
    - {item: antidote_moss, chance: 0.3}
    - {item: marsh_mushroom, chance: 0.5}
