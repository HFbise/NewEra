start_room: square

# 刷新规则（测试期时间设得短，以后调长）：
#   房间 items 写成 {item: 物品, respawn: 秒}，被拿走后多久在原处重新出现；只写物品名就是默认 300 秒
#   出口 relock: 秒，打开后多久自动锁回去
#   NPC respawn: 秒，死后多久复活；restock: 秒，身上 inventory 给出去后多久补回来（默认 300）
#   房间 forage: [{item, chance, cooldown}]，"搜索"时找到（chance 默认 1.0 一定找到；cooldown 默认 0，设了就是每人找到后隔几秒才能再找到）
#   物品 slot：装在哪（hand 左右手都行 / ring 两个戒指位都行 / head / chest / belt / legs / feet / neck），
#     武器默认 hand、护甲默认 chest；双持时普通攻击两把武器伤害相加，所有装备的防御相加
#   房间 dispensers: {key: {name, description, item, unless, where, once}}，武器桶这类取用处：身上有 item 或 unless 里的东西就不能拿；
#     once: true 是每人一辈子只能拿一次（丢了也不能再拿）；where 是"里"（桶里）或"上"（桌上）

rooms:
  square:
    name: 村口广场
    description: 石板铺成的小广场，中间一口老井，四周是低矮的木屋。
    # details 只给 AI 看：不能拿、不参与规则的环境细节，玩家可以摸、敲、闻、看（freeform）
    details: >-
      老井的井沿是青灰色的石头，被磨得光滑，缝里长着青苔；井上架着木辘轳，挂着一根磨毛的麻绳和一只空木桶，
      往下看黑沉沉的，丢颗石子要过一会儿才听见水声。石板缝里嵌着干泥和几根鸡毛。
      广场边有一棵老槐树，树干上钉着一块空白的旧木牌，牌面被雨水泡得发黑，看不出原来写过什么。
      木屋都关着门，屋檐下挂着成串的干辣椒和玉米，有一户窗台上晒着一双补过的布鞋。
      北边野猪酒馆的招牌是一块刻着野猪头的木板，东边铁匠铺传来有节奏的敲打声，南边是出村的土路。
      西边一间窄门脸的小铺子，门楣上挂着褪色的木牌"杂货"，窗户里书和杂物堆得看不见人。
    exits:
      north: {to: tavern}
      east: {to: smithy}
      south: {to: path}
      west: {to: general_store}
    items: [{item: bread, respawn: 120}]
    # 井上的麻绳能解下来捆人（捆人必须用地形或背包里的东西），用一次后过一阵才有新的
    features:
      well_rope: {name: 井上的麻绳, max_tier: light, uses: 1, respawn: 300}

  tavern:
    name: 野猪酒馆
    description: 昏暗的酒馆，空气里混着麦酒和烤肉的味道。角落有一扇通往地窖的木门。
    details: >-
      一条长长的橡木吧台，台面上满是杯底压出的水印和刀刻的名字缩写，吧台后面的架子上摆着一排陶酒壶。
      壁炉里烧着木柴，铁叉上架着半只烤着的羊腿，油滴进火里滋滋作响。
      四五张粗木桌，长凳坐得发亮，一张桌腿下垫着折起来的皮子防晃。
      墙上挂着一个落满灰的野猪头标本，一只獠牙断了一截。
      门边立着一只箍着铁圈的旧木桶，里面插着几把生锈短剑，都是被麦琪轰出去的闹事者落下的，桶上用粉笔写着"缺家伙的拿一把，别贪"。
      地窖门是厚木板钉的，门上一把黑铁大锁。
      壁炉噼啪作响，吧台后麦琪踩在垫脚木箱上擦着杯子。
    exits:
      south: {to: square}
      down: {to: cellar, locked: true, key: cellar_key, relock: 120}
    npcs: [innkeeper]
    dispensers:
      weapon_barrel:
        name: 武器桶
        description: 门边一只箍着铁圈的旧木桶，插着几把生锈的短剑，都是被麦琪轰出去的闹事者落下的。桶上用粉笔写着"缺家伙的拿一把，别贪"。
        item: rusty_sword
        unless: [shiny_sword]
        once: true              # 每人只能拿一把，丢了、交给莉娜了也不能再拿
    features:
      spit: {name: 壁炉上的铁叉, max_tier: heavy, uses: 1, respawn: 120}

  cellar:
    name: 酒馆地窖
    description: 潮湿阴冷，堆满了酒桶，只有楼梯口透下来一点光。墙角有一张落满灰的旧木桌，最里面的墙上有一个漆黑的入口，旁边立着一块石碑。
    details: >-
      酒桶沿墙码成两层，大多是满的，敲起来声音发闷；最里面几只空桶敲起来咚咚响，桶身上用粉笔写着年份。
      墙是粗石砌的，摸上去又冷又湿，渗着水珠，角落结着蛛网。
      地面是压实的泥土，有几道拖桶留下的划痕。空气里是木头、霉味和酸酒的味道。
      木楼梯吱呀作响，通回上面的酒馆。墙角有一张落满灰的旧木桌，堆着麦琪收来的古董。
      最里面那面墙上开着一个一人高的拱形入口，四周没有门、没有帘子，什么也没挡着，可无论怎么凑近看，里面都只有一片化不开的漆黑，
      连提灯的光照进去都像被吞掉了；往里走（往下）就是传说中的远古地牢。一股微弱的冷风从里面吹出来，带着很深很深的地底的味道。
      入口旁边立着一块黑色的石碑。
    exits:
      up: {to: tavern}
      down: {to: dungeon_gate}
    npcs: [stele]
    dispensers:
      antique_table:
        name: 桌子
        description: 墙角的一张落满灰的旧木桌，桌腿被虫蛀得坑坑洼洼。上面堆着麦琪这些年收来的古董：缺口的铜烛台、裂了缝的青瓷碗、一把没有弦的鲁特琴、几枚看不清年号的铜币，还有一面锈得照不出人影的小铜镜。
        item: old_amulet
        where: 上
        once: true              # 拿过就没了，丢了也不能再拿

  # 占位：地窖的漆黑入口、地牢楼梯间往下都连到这里，引擎按玩家的队伍和层数换成真正的地牢房间（dungeon.py），没人会站在这里
  dungeon_gate:
    name: 漆黑的入口
    description: 通往远古地牢的入口。

  smithy:
    name: 铁匠铺
    description: 炉火正旺，墙上挂着各式农具和几把粗糙的武器。
    details: >-
      熔炉用红砖砌成，风箱是牛皮做的，拉一下炉火就呼地一旺；屋里热得人冒汗，满是煤烟和铁锈味。
      铁砧黑亮，边上摆着大小几把锤子和长柄火钳，一桶淬火用的水表面浮着一层油光。
      墙上挂的镰刀、锄头、斧头和几把粗糙的刀都是莉娜的货，用铁钩挂得很牢，想要就得跟她谈价钱。
      地上落着铁屑和煤渣，门口堆着一小堆等着修的破农具。
    exits:
      west: {to: square}
    npcs: [smith]

  general_store:
    name: 杂货铺
    description: 狭长昏暗的小铺子，货架和书堆一直顶到天花板，空气里是旧纸、灯油、干草药，还有一丝花草茶的香气。
    details: >-
      柜台是一张厚橡木长桌，上面杂乱地堆满了大大小小的硬皮书，只在中间挤出一点空间放着算盘和铜秤。书堆后贴着地面放着一张加高的小木凳，上面铺着柔软的浅色毛毯，旁边还搁着半杯冒着温热白气的花草茶与一张擦眼镜用的绒布。
      墙边的货架上挂着麻绳、浸油火把与卷好的帆布帐篷，最上层的玻璃罐里装着微微发光的淡蓝水晶。每个货架边缘都贴着手写的小标签，字迹工整纤细，价格后还小字附注着“请轻轻拿放，谢谢”。
      角落里是她的“私密藏书室”：几座摇摇欲坠的书塔，有的书脊印着烫金古文字，有的贴着写有“不卖”的纸条。地上铺着一块几乎能吸收所有脚步声的旧地毯。
      当门口的小铜铃随推门声叮当响起时，书堆后面那蓬松的白发头顶瞬间吓得缩了缩。随后，一双带着圆框眼镜、怯生生的琥珀色眼睛从书缝里露了出来，紧包着怀里的旧书，像只惊恐的小猫。
    exits:
      east: {to: square}
    npcs: [shopkeeper]

  path:
    name: 村外小路
    description: 泥土小路通向南边的森林，路边长着几丛药草。
    details: >-
      路面上有车辙和脚印，低洼处积着一滩泥水。路两边是野草和几丛开着小白花的荆棘。
      一块半埋在土里的里程石，上面刻的字已经磨平了。
      回头能看见村子的屋顶和酒馆烟囱冒出的烟，往南路越走越窄，钻进树林里。
      草丛里有虫鸣，偶尔有只麻雀从路面飞起。药草混在野草里，不仔细翻找认不出来。
    exits:
      north: {to: square}
      south: {to: forest_edge}
    forage: [{item: herb}]

  forest_edge:
    name: 森林边缘
    description: 高大的树木遮住了阳光，林子里又暗又静。
    details: >-
      粗大的橡树和松树，树皮上长着苔藓和灰白色的地衣，树根盘在地面上，容易绊脚。
      地上铺着厚厚的落叶和松针，踩上去软软的，底下是湿的。
      灌木丛很密，枝条上挂着几缕被扯下的灰毛。一棵倒下的枯树横在路边，树干中间已经空了。
      路边的土坡上半埋着一块磨盘大的石头，底下的土被雨水掏空了，看着推一把就会滚下来。
      远处偶尔传来鸟叫，空气里是腐叶和松脂的味道。再往南没有路了，树林密得走不进去。
    exits:
      north: {to: path}
    npcs: [goblin]
    # 可利用地形：玩家拿它做文章（推、砸、绊）时最多打出 max_tier 档伤害（light/heavy/lethal），
    # 用 uses 次后 respawn 秒恢复。details 里写到但没列在这的东西也能用，最多轻伤，而且不能拿来捆人
    features:
      boulder: {name: 松动的大石头, max_tier: lethal, uses: 1, respawn: 300}

# 物品的 heal 是"回血点数"，不是直接回多少血：吃喝时按吃的人血量上限折成百分比（engine.heal_amount）
#   普通吃喝每 1 点回 5%（heal: 6 的药草 = 30%），酒（名字带"酒"或 props.alcohol）每 1 点回 3%（heal: 2 的黑啤 = 6%）
#   血量上限 200 时 1 点回 10 血；耐性升级、上限变高后回得跟着变多。最少回 10 血
#   建议价也是按点数算的（engine.base_price），所以这里别直接写百分比
# 有毒的 harm（props 里）还是按点数直接掉血
items:
  bread:
    name: 面包
    description: 有点硬的黑麦面包。
    type: consumable
    heal: 3
    props: {price: 1, kind: food}
  herb:
    name: 药草
    description: 散发清香的绿色草叶，据说能止血。
    type: consumable
    heal: 6
    props: {price: 4, herbal: true, kind: salve}   # 药草：用药的人自然等级越高回血越多；外用药，给别人敷还看医药
  rusty_sword:
    name: 生锈的短剑
    description: 剑刃布满锈迹，但还算锋利。
    type: weapon
    damage: 40
    props: {price: 5}
  cellar_key:
    name: 地窖钥匙
    description: 一把沉甸甸的铁钥匙。
    type: key
    props: {price: 10}
  old_amulet:
    name: 古旧护符
    description: 刻着看不懂的符文，在昏暗处微微发着蓝光。
    type: armor
    slot: neck
    defense: 20
    props: {price: 25}
  shiny_sword:
    name: 闪亮的短剑
    description: 莉娜重新锻打、磨得雪亮的短剑，刃口能照出人影。
    type: weapon
    damage: 60
    props: {price: 35}
  # 莉娜墙上的货（她的 sells），价钱由 AI 看心情定
  iron_axe:
    name: 铁斧
    description: 斧刃厚实的铁斧，劈柴砍人都顺手。
    type: weapon
    damage: 50
    props: {price: 20}
  forge_knife:
    name: 锻打小刀
    description: 粗糙但结实的短刀，刀背还留着锤痕。
    type: weapon
    damage: 30
    props: {price: 8}
  sickle:
    name: 镰刀
    description: 弯月形的农用镰刀，挥起来带着风声。
    type: weapon
    damage: 30
    props: {price: 8}
  # 护甲和盾：防御都加在一起。盾占一只手（slot: hand），跟双持、火把抢位置，所以给的防御比同价位的护甲高
  # 莉娜墙上卖的是入门的一档（皮帽、皮甲、木盾）；铁盾、锁子甲以后从地牢里出
  leather_cap:
    name: 皮帽
    description: 一顶鞣过的厚皮帽，内衬塞着羊毛，能挡住从头顶落下的碎石。
    type: armor
    slot: head
    defense: 10
    props: {price: 6}
  leather_armor:
    name: 皮甲
    description: 用几层牛皮缝成的短甲，胸口钉着几片铁片，轻便不碍事。
    type: armor
    slot: chest
    defense: 10
    props: {price: 8}
  wooden_shield:
    name: 木盾
    description: 一面包了铁边的圆木盾，占一只手，挡得住大多数的抓咬和棍棒。
    type: armor
    slot: hand
    defense: 20
    props: {price: 10, block: 0.10}      # 格挡：几率完全挡下一击（跟闪避合计最多 30%）
  iron_shield:
    name: 铁盾
    description: 一面沉甸甸的铁皮盾，边缘有好几道砍痕，举起来能挡住大半个身子。占一只手。
    type: armor
    slot: hand
    defense: 30
    props: {price: 30, block: 0.15}
  chain_mail:
    name: 锁子甲
    description: 用成千上万个铁环编成的甲衣，穿上身沉，但刀砍上去只擦出火星。
    type: armor
    slot: chest
    defense: 20
    props: {price: 30}
  # NPC 现造东西用的通用模板（NPC 的 creates 配置），名字和描述由 AI 起，存在物品实例上
  made_food:
    name: 食物
    description: NPC 做的吃的。
    type: consumable
    stackable: false
    heal: 2
  made_drink:
    name: 酒水
    description: NPC 调的喝的。
    type: consumable
    stackable: false
    heal: 2
  made_misc:
    name: 杂物
    description: NPC 给的小东西，比如字条、信物。
    type: misc
  made_weapon:
    name: 武器
    description: NPC 现打的武器。
    type: weapon
  # 麦琪吧台上的酒（她的 sells），人设里常提的那几样
  dwarf_stout:
    name: 矮人黑啤
    description: 盛在厚木杯里的黑啤，泡沫像奶油一样绵密，麦芽的焦香里带点苦，据说是按矮人的老方子酿的。
    type: consumable
    heal: 2
    props: {price: 2, alcohol: true}
  elf_mead:
    name: 精灵蜜酒
    description: 细颈玻璃瓶里金黄透亮的蜜酒，入口清甜，带着野花和松针的香气，后劲绵长。
    type: consumable
    heal: 4
    props: {alcohol: true, price: 6}
  dragon_breath:
    name: 龙息烈酒
    description: 装在黑陶小盅里的烈酒，点火就着，一口下去喉咙像着了火，胸口却暖得发烫。一杯顶别人的两杯。
    type: consumable
    heal: 3
    props: {alcohol: true, strength: 2, price: 10}   # 喝醉几率按两杯算
  sober_potion:
    name: 解酒药
    description: 麦琪自己熬的醒酒汤，装在小陶瓶里，闻着又苦又冲，一口下去酒意全消。
    type: consumable
    props: {sober: true, price: 3, kind: potion}   # 喝了马上酒醒；没数值的东西在 props.price 写建议价
  # 诺艾尔杂货铺的货（她的 sells）。火把、帐篷、回城水晶是给地牢准备的，地牢做好之前只是能买
  rope:
    name: 麻绳
    description: 一捆结实的粗麻绳，能捆东西、捆人，也能垂下去攀爬。
    type: misc
    props: {price: 2}
  # 火把三种样子：背包里的火把 → 拿到手上就点着（火把（点燃））→ 带到地牢下一层变成火把（弱光）→ 再下一层烧完。
  # 点着的火把只能拿在手上：收起来、扔掉就熄了、没了（要玩家再说一次确认），不能给人、不能卖（engine 火把部分）
  torch:
    name: 火把
    description: 缠着浸油麻布的木火把，拿到手上就点着（占一只手）。点着以后在地牢里能撑两层：第二层火光变小，到第三层烧完；点着的火把收起来就熄了，没法再点。
    type: weapon
    damage: 20
    props: {price: 2, lights: torch_lit}   # 装备时换成 torch_lit
  torch_lit:
    name: 火把（点燃）
    description: 一支正烧得旺的火把，火光能照亮周围一大片。只能拿在手上，收起来就灭了。
    type: weapon
    damage: 20
    props: {light: 35, burning: torch_dim, fire: true}   # 光亮 +35；到地牢下一层换成 torch_dim
  torch_dim:
    name: 火把（弱光）
    description: 一支快烧到头的火把，火苗缩成了一小簇，只能照亮脚边。再往下走一层就要灭了。
    type: weapon
    damage: 20
    props: {light: 20, burning: "", fire: true}   # 光亮 +20；到地牢下一层就烧完
  tent:
    name: 帐篷
    description: 卷成一捆的帆布小帐篷，在野外或地牢里扎营时能睡得安稳些。
    type: misc
    props: {price: 15, camp: true}
  recall_crystal:
    name: 回城水晶
    description: 淡蓝色、微微发光的水晶，据说在远古地牢里捏碎它就能被传回村子。诺艾尔说这是从某本古书里学来的做法。
    type: misc
    props: {price: 20, recall: true}
  # 血药：回一半血（heal 每点 5%）。比食物贵得多，但一瓶顶三个面包，还能给倒下的队友灌下去；
  # 价钱按回血公式算是 23，地牢一层的收入大约能买五六瓶
  blood_potion:
    name: 血药
    description: 一只拇指粗的小玻璃瓶，里面是暗红色、微微发稠的药水，瓶口用蜡封着，贴着诺艾尔手写的标签。喝下去伤口很快就不疼了，也能给倒下的同伴灌下去。
    type: consumable
    heal: 10
    props: {price: 24, kind: potion}
  trail_rations:
    name: 干粮
    description: 一包用油纸裹着的熏肉干和硬饼，麦琪说是给"出门送死的杂鱼"备的，放一个月也坏不了。
    type: consumable
    heal: 5
    props: {price: 3, kind: food}
  antidote:
    name: 解毒剂
    description: 一只贴着手写标签的小玻璃瓶，标签上用很小的字写着配方出自哪本书的第几页。喝了解毒。
    type: consumable
    heal: 1
    props: {price: 5, cure: poison, kind: potion}
  tavern_stew:
    name: 麦琪的炖肉
    description: 一大碗炖得软烂的肉块和土豆，汤面上浮着一层油花，麦琪说里面放了“秘方”，问是什么就只笑不答。
    type: consumable
    heal: 8
    props: {price: 5, kind: food}
  beast_bone:
    name: 肉骨头
    description: 后厨剁剩下的大骨头，上面还挂着不少肉丝，野兽闻到了多半顾不上别的。
    type: misc
    stackable: true
    props: {price: 2, bait: true}   # 扔给一只野兽：它叼着骨头走开，不再参与这一仗，也不掉东西；头目不吃这套（engine._bait）
  paper_note:
    name: 纸条
    description: 一张裁得歪歪扭扭的粗纸，附带一小截炭笔，能写几句话。
    type: misc
    props: {price: 1, writable: true}   # "在纸条上写……"：文字存进这张纸条，限 100 字，写过的不能再改（engine.do_write）
  # 小礼物：三个人互相卖对方喜欢的东西。gift_value 是送出去加的好感（不写就是心爱礼物的 LIKED_GIFT），
  # 小礼物每个 NPC 每天只收一件（engine.SMALL_GIFT_DAILY）
  southern_wine:               # 诺艾尔卖，送麦琪
    name: 南方怪酒
    description: 一只贴着看不懂的外国字标签的扁酒瓶，是南方商队顺路捎来的，诺艾尔自己一口都没尝过。
    type: consumable
    heal: 2
    props: {price: 8, alcohol: true, gift: wine, gift_value: 3}
  hardwood_charcoal:           # 诺艾尔卖，送莉娜
    name: 硬木炭
    description: 一麻袋烧得透透的硬木炭，敲起来声音清脆，据说烧起来火最稳。
    type: misc
    props: {price: 8, gift: ore, gift_value: 3}
  travel_journal:              # 麦琪卖，送诺艾尔
    name: 冒险者的游记
    description: 一本皮面起了毛的小本子，是某个再也没回来付酒钱的冒险者留在酒馆里的，最后几页的字迹越来越潦草。
    type: misc
    props: {price: 8, gift: book, gift_value: 3}
  leather_boots:               # 莉娜卖：脚部位的入门货，商店全套防御到 5，再往上靠地牢
    name: 皮靴
    description: 一双缝得结结实实的短筒皮靴，鞋底钉了几颗铁钉，踩在湿石头上不打滑。
    type: armor
    slot: feet
    defense: 10
    props: {price: 7}

  # 回礼：好感到了某一档，来聊天时 NPC 送的东西（见各 NPC 的 return_gifts）
  maggie_trap_map:
    name: 麦琪的地牢手记
    description: 一张被酒渍泡皱的羊皮纸，上面用炭笔标满了她记得的陷阱和安全的落脚处，角落歪歪扭扭写着"别死了笨蛋"。带在身上，地牢路上的陷阱更容易看出来。
    type: misc
    props: {price: 30, trap_sense: 2}      # 走路碰到陷阱时察觉的难度 -2
  # 麦琪的酒壶和药（回礼）：用完变成"（空）"，找麦琪说"续杯"灌满（props.refill_by 是她的模板 id，refill_to 是满的样子）
  maggie_antidote:
    name: 解毒酒壶
    description: 一只小小的皮酒壶，里面是麦琪泡了解毒草的烈酒，闻着又苦又冲。喝下去能解毒，还能缓一口气；喝完了回酒馆找她续杯。
    type: misc
    props: {price: 60, antidote: 4, empty: maggie_antidote_empty}     # 解毒，回 4 点（20%）
  maggie_antidote_empty:
    name: 解毒酒壶（空）
    description: 麦琪的解毒酒壶，已经喝空了，晃一晃只剩一股苦味。回酒馆找她说"续杯"。
    type: misc
    props: {price: 60, refill_by: innkeeper, refill_to: maggie_antidote}
  maggie_drug:
    name: 一口倒
    description: 麦琪特调，装在拇指大的小瓷瓶里，封口的蜡上按着她的指印。泼向一个敌人（或者骗它喝下去），它会一下子醉倒，动弹不得（头目只管一轮）；用完了回酒馆找她续上。
    type: misc
    props: {price: 80, drug: 醉倒在地，动弹不得, empty: maggie_drug_empty}
  maggie_drug_empty:
    name: 一口倒（空）
    description: 装一口倒的小瓷瓶，已经空了，瓶底还沾着一点甜腻的味道。回酒馆找她说"续杯"。
    type: misc
    props: {price: 80, refill_by: innkeeper, refill_to: maggie_drug}
  maggie_flask:
    name: 麦琪的私酿
    description: 一只磨得发亮的旧锡酒壶，装着麦琪自己酿的酒。壶底歪歪扭扭刻着"回头见"，后面还有一颗小小的心。喝一口伤一下子就好了，浑身是劲（这一层攻击 +25%）。喝完回酒馆找她续上。
    type: misc
    props: {price: 200, flask: true, empty: maggie_flask_empty}      # 回满血；这一层攻击 +25%（engine._flask）
  maggie_flask_empty:
    name: 麦琪的私酿（空）
    description: 麦琪给的那只旧锡酒壶，已经喝空了，壶底那行"回头见"和小小的心还在。回酒馆找她说"续杯"。
    type: misc
    props: {price: 200, refill_by: innkeeper, refill_to: maggie_flask}
  # 远程武器（props.ranged）：贴身难射、离远了准（engine.RANGED_HIT）；steady 的远近都一样准。
  # 射完换成 unloaded 那个"空"的样子，说"装填"才换回来（算一个动作）
  maggie_crossbow:
    name: 麦琪的轻弩
    description: 麦琪藏在吧台下的那把轻弩，弩臂上缠着磨旧的皮绳，扳机护圈里刻着一个歪歪扭扭的"杂"字。单手就能端平，射出去又稳又准，远近都一样；射完要重新上弦（说"装填"）。
    type: weapon
    slot: hand
    damage: 100
    props: {price: 150, ranged: true, steady: true, ammo_kind: arrow, unloaded: maggie_crossbow_empty}
  maggie_crossbow_empty:
    name: 麦琪的轻弩（空）
    description: 麦琪的那把轻弩，弦松着，槽里空空的。说"装填"重新上弦才能再射。
    type: weapon
    slot: hand
    damage: 100
    props: {price: 150, ammo_kind: arrow, loads: maggie_crossbow}
  # 莉娜的回礼（好感 100）：伤害按玩家走到过的最深层数定，带一个武器词条，能自己起名（engine._exclusive_blade）
  lina_oil:
    name: 莉娜的淬火油
    description: 一小罐黑亮的油，莉娜自己配的，锻打时浸一下就能稳稳锁住那一层锻纹。升级时用上（说"用淬火油升级某某"），那一次必定成功，她也不收钱。
    type: misc
    props: {price: 60}
  lina_blade:
    name: 无铭
    description: 莉娜熬了好几个晚上亲手打的一把剑，剑脊上錾着一个小小的火焰纹，那是她的记号，剑上却没刻名字。握柄的长短正好合你的手。它会跟着你走过的地牢一起变强。
    type: weapon
    slot: hand
    damage: 60
    props: {price: 150, exclusive: true}
  noelle_bookmark:
    name: 守护书签
    description: 一枚压得平平整整的干花书签，是诺艾尔从她怀里那本书里抽出来的，夹在书里的那一面写着一行细小的字。带在身上，本该倒下的那一击会被它挡下来，每层一次（跟别的免死东西合起来每层也只有一次）。
    type: misc
    props: {price: 150, guard_once: true}  # 地牢里每层一次，挡下一次致命的攻击（engine._npc_strike）
  noelle_tome:
    name: 诺艾尔珍视的书
    description: 诺艾尔总是紧紧抱在怀里的那本厚重的古旧硬皮书，皮面被她摸得发亮，书页里少了一枚书签。在敌人面前念出来，周围所有敌人都会僵住动弹不得（头目只管一轮）；书不会化成灰，每层能念一次。
    type: misc
    props: {price: 200, stun: 被古老的文字定住了身形, per_floor: true}

  # 地牢随机事件房里的东西。矿石、古酒、古书以后是送给莉娜、麦琪、诺艾尔的礼物
  ore:
    name: 奥利哈刚矿石
    description: 一块拳头大的矿石，青灰色，沉甸甸的，断面上闪着金属的光泽。铁匠见了大概会两眼放光。找莉娜升级时锻进去，失败了也不会掉级，成功那次才用掉。
    type: misc
    props: {price: 100, gift: ore}
  ancient_wine:
    name: 陈年古酒
    description: 一只封着泥的旧陶罐（或者落满灰的酒瓶），晃一晃里面的酒还在响，闻着有一股深沉的陈香。爱酒的人会想要。
    type: consumable
    heal: 30
    props: {alcohol: true, strength: 2, price: 12, gift: wine}
  old_tome:
    name: 古书残卷
    description: 一本用皮绳捆着、封在蜡里的古书，书页泛黄发脆，写着看不懂的古老文字。在敌人面前翻开念出来，周围所有敌人都会一时僵住动弹不得（念完书就化成灰了）。爱书的人会很珍惜。
    type: misc
    props: {price: 50, gift: book, stun: 被古老的文字定住了身形}   # 有敌人时使用：房间里所有敌人一定定身（engine._stun），书用掉
  spring_water:
    name: 泉水
    description: 一瓶从地下泉眼接来的清水，冰凉微甜，喝下去浑身一轻。
    type: consumable
    heal: 10
    props: {price: 8, kind: drink}
  # 地牢宝箱房里的钱袋：捡起来直接变成金币（数目在实例 props.gold）
  gold_pouch:
    name: 一袋古币
    description: 一只发霉的皮钱袋，沉甸甸的，里面是些看不出年代的古老金币。
    type: misc
  old_map:
    name: 标着陷阱的破地图
    description: >-
      一张卷了边、沾着酒渍的羊皮纸，用木炭潦草地画着：村口广场在中间，北边是野猪酒馆（酒馆底下有地窖），
      东边是铁匠铺，南边一条小路通到森林边缘。森林边缘画了个叉，旁边写着"哥布林，胆小但手黑"；
      路边土坡上的大石头被圈起来，标着"松了，别站坡下"。
    type: misc
    props: {price: 15}

npcs:
  innkeeper:
    name: 麦琪
    # description 是别人一眼能看到的外表；persona 是性格、来历、说话方式，只给 AI 看
    description: 酒馆老板娘兼调酒师，一米四出头、看上去像个十五六岁的纤细金发少女，但没人敢问她的实际年龄。一头凌乱的金色卷发随手扎在脑后，湛蓝的眼睛总带着三分酒意和看戏的神情，嘴角挂着看透一切的戏谑微笑。个子太小，在吧台后要踩着一个垫脚木箱。穿粗布衬衫、皮胸衣和牛皮围裙，腰间挂着沉甸甸的铁钥匙串，手里永远端着一只盛满酒的雕花锡杯。吧台下藏着一根带钢环的橡木短棍、一柄切肉刀和一把上了弦的轻弩。
    persona: 说话风格：慵懒轻快，带着酒馆的粗犷和风趣。习惯边晃酒杯边抿一口，长句中间停顿处恰好是喝酒的节奏，像在用酒打拍子。叫人"杂鱼"时发音刻意拉长，“杂ー鱼♡”拖出一个上扬的尾调。骂那些挑衅骚扰的人骂得花样百出，但从不重样，这是她无聊时的娱乐。
             千杯不醉：常年微醺，酒精只让她的直觉更毒辣。闻一闻就知道客人刚从哪类地牢出来：哥布林巢穴是“腐臭”、酸液陷阱是“刺鼻”、亡灵墓穴是“阴冷霉味”。说话爱打比方，信手拈来战场往事、怪物习性、客人糗事和各种酒（矮人黑啤、精灵蜜酒、龙息烈酒、南境商队弄来的怪酒），每次换着用。打听消息先点三杯最贵的烈酒，没钱的杂鱼也可以替她干活来换——抓老鼠也行，她才分不清是地牢的还是酒馆后厨的。
             地盘意识：谁坐哪桌、谁能赊账、谁该被轰出去，全由她说了算。有人闹事，她笑得最甜地端上一杯"特调"：里面什么都能放。等人喝完倒地再抄起橡木棍乱打一顿再拖出去扔后巷。门边武器桶插满锈剑，都是被她轰出去的醉鬼落下的，她懒得还，留给缺家伙的新人拿。有人问起，她得意地报出一串名字和缴械经过，像在炫耀战利品陈列柜。
             嚣张挑逗：嘴上从不饶人，见人先打量一遍再下判断，开口就是损。语气慵懒、拖腔带调，尾音常上扬，像在逗弄笼里的仓鼠。喜欢凑近了说话：踮脚扒着吧台沿，凑到对方脸前不到一掌的距离，歪头、眯眼、笑，然后吐出一句足以让人血压飙升的话。越是有名的冒险者，她越要结合对方的标记挑逗。但她的嚣张有分寸：绝不碰人真正的伤疤（死去的同伴、灭门之仇）。
             高攻低防： 她把人损得体无完肤时面色不变；可一旦有人不按套路出牌：认真地夸她、直球关心她、或反将她一军，她就会卡壳。眼睛瞪圆、酒杯举到半空忘了喝、耳尖泛红、嘴唇动两下说不出话，最后"嘁"一声扭头灌酒，耳根红到脖子。偶尔被叫破心事，她会罕见地收起嬉皮笑脸，害羞地嘟囔。
             嘴硬心软：遇见向她道别的冒险者，她满嘴"去送死的笨蛋杂鱼"，但冒险者出发前她递的酒里常会多些碾碎的解毒草。有人问她地图怎么走到某处，她翻个白眼"连路都不认识的笨蛋杂鱼"，然后甩出一张羊皮纸，上面用炭笔标了她记得的所有陷阱与安全营地，角落画了个歪歪扭扭的"别死了笨蛋"。谁要是真受了重伤被抬回酒馆，她在吧台后脸色一白、酒杯都能扔开，就跳下木箱冲过去。嘴里还在骂"谁让你这么逞能的啊杂鱼笨蛋"，手上撕绷带的动作却轻得像在碰瓷瓶。事后绝不承认自己担心过。
             顺手生意：后厨的麻绳、火把、面包、药草也卖给要出门的杂鱼，但这不是酒馆的本行，开价总比诺艾尔杂货铺贵一截，嫌贵就让他自己去找那个书呆子。
    inventory: [cellar_key, old_map]
    restock: 60
    props:
      # 给予规则（不写就是不给）：
      #   ai                                  AI 看人设自己决定
      #   {requires: 标记, min_affinity: 数值}  两个条件可以只写一个，都写就要同时满足
      gives:
        cellar_key: {requires: goblin_slain}   # 任务奖励给过、玩家弄丢了还能再要
        old_map: ai                            # 地图给不给、要不要钱看她心情
      # 能现做什么、效果上限（AI 定具体数值，引擎按上限裁剪；开价按效果算，可以砍价，白送的话 3 分钟一次）：
      #   food 食物 / drink 酒水：heal 回血上限；harm 有毒掉血上限；knockout: true 能下蒙汗药把人放倒
      #   weapon 武器：damage 伤害上限
      #   misc 杂物（字条、信物）：没效果
      # 暂时关掉现做（AI 起名的东西没有正式物品的属性，蜡烛当不了火把，玩家拿到发现没用）。
      # 只留一样：给闹事的人调一杯下了药的特调放倒他（knockout_only，别的酒水不现做）。原来的配置：
      #   food: {heal: 5, harm: 5, knockout: true}  drink: {heal: 5, harm: 5, knockout: true}  misc: {}
      creates:
        drink: {knockout: true, knockout_only: true}
      # 玩家闹事时能把人轰出去：从这个出口扔出去。不写就不能轰人
      # 能住店：付钱睡一觉回满血、醒酒
      inn: {price: 5}
      # 收购：什么都收，likes 里的种类（weapon armor food drink herb ore wine book misc）给价高
      buys: {likes: [food, drink, herb, wine]}
      # 心爱的礼物（物品 props.gift 的种类）：送了好感 +10，有特别的台词
      gift_likes: [wine]
      # 回礼：好感到了这一档，他来聊天时送一次（每档一次，好感掉了再涨回来也不会再送；engine.return_gift）
      #   item 是送的东西，perk 是解锁的本事（引擎认），text 是给台词看的说明。40、60 还没定
      return_gifts:
        20: {item: maggie_trap_map, text: 她的地牢手记，一张标满了陷阱和落脚处的羊皮纸（带在身上，地牢路上的陷阱更容易看出来）}
        40: {item: maggie_antidote, text: 一只装着解毒草泡的烈酒的皮酒壶（喝了解毒）}
        60: {item: maggie_drug, text: 一小瓶她的特调"一口倒"（泼向敌人能让它醉倒）}
        80: {item: maggie_crossbow, text: 她吧台下那把上了弦的轻弩（单手就能端平，远近一样准，射完要重新上弦）}
        100: {item: maggie_flask, text: 一只装着她私酿的旧锡酒壶，壶底偷偷刻着"回头见"和一颗小小的心（喝一口回满血，这一层浑身是劲）}
      # 吧台上的货，价钱由 AI 按建议价浮动
      # 麻绳、火把、面包、药草是后厨的顺手生意（人设里写了开价比诺艾尔贵）
      sells: [dwarf_stout, elf_mead, dragon_breath, sober_potion, trail_rations,
              tavern_stew, beast_bone, travel_journal, rope, torch, bread, herb]   # 游记是送诺艾尔的小礼物
      # 后厨的顺手生意不是本行：建议价 ×1.5，而且砍不到这个价以下（engine.markup / clamp_price）
      markup: {rope: 1.5, torch: 1.5, bread: 1.5, herb: 1.5}
      eject_to: south
      # 店里有人倒下时扶起来回满血，按倒下的原因说一句（{name} 倒下的人，{by} 打倒他的怪、人或者吃下的东西）
      revive_lines:
        npc: 麦琪踩着木箱边沿翻过吧台，钥匙串叮当乱响，拖鞋啪嗒啪嗒跑到跟前。她蹲下来歪头打量了三秒，酒杯往旁边一搁，捏住鼻子把人晃醒。"Ciallo—~~？还活着呢？被{by}揍成这副德行还有脸躺我地板上…杂鱼就是杂鱼，躺着的姿势倒是挺熟练的嘛。"她从地上摸起半杯残啤往{name}嘴里灌，酒液里混着一缕苦草回甘。灌完她站起来拍拍膝盖，背过身踩回木箱，脚步轻快："哼~好了就快起来。地板都被你弄脏了！"
        player: 麦琪用脚尖踢了踢{name}的腰。"喂——"没反应，又踢了一脚，力道却比头一下轻。"还要在这儿睡到什么时候呀，笨蛋杂鱼冒险者！"她蹲下，从围裙兜里掏出半壶酒往{name}怀里一塞，顺手在对方衣服上蹭了蹭手上的灰。"输给{by}了？哼。杂鱼就是杂鱼，约架前不掂掂自己几斤几两。"她踩回木箱，酒杯在指间转了一圈，灌了一大口，忽然嘁了一声，声音低下去。"……就算是这么笨的笨蛋，但竟然把我的客人揍成这样。哼，{by}这个白痴也是真的欠收拾了。"
        poison: 麦琪在吧台后鼻子一皱，嗅到味道后表情从醉意换成锐利。"…这个味道？"她翻身跃过吧台，从下层摸出一碗黑糊糊的汤药，蹲到{name}跟前。"{by}这种东西也敢碰？笨蛋…你的胃口比愚蠢的脑子还要大了吧！杂鱼冒险者，想死的话也不要在我面前死啊。"她捏住{name}鼻子灌下去，手法利落得像在给宠物喂药，一点都不像酒馆老板娘。"咽下去哦，乖乖的不要吐出来。哼……{name}要是吐了的话，我可不会重新灌的。"灌完甩了甩手上的药渍，低头看了眼杯子里的药渣，小声嘀咕："……又少一碗。喂，下次自己带解药来，杂鱼！"
        other: 麦琪拖着后领把{name}拽上长凳，钥匙串拖在地上刮了一路。"醒醒——要睡到什么时候啊，笨蛋、杂鱼。"她拍了拍{name}脸，掌心比嘴上的话轻得多，停了一拍才补了第二下。"这里是酒馆，不是停尸房。你如果真的死了…哼，欠我的酒钱就没有人还了。"她从围裙兜里掏出块抹布丢到{name}胸口，转身踩回木箱。酒杯碰沿，却等到{name}悠悠睁眼才抿了一口。湛蓝眼睛悄悄从杯沿上方扫过来，视线停了三秒才又移开。"……擦擦脸啦，杂鱼。能脏成这样的笨蛋，也就只有我才会大发善心留你在这里呢，哼。"
  smith:
    name: 莉娜
    description: 铁匠铺技术老练的年轻女铁匠，因炉火烘烤常年只穿透气的粗麻布抹胸与短裤，外罩一条斑驳防烫的厚重皮围裙，露出健壮有力、线条分明的肌肉与小麦色肌肤，浑身蒸腾着热气并挂满晶莹的汗珠。一头利落的暗红马尾随手扎在脑后，脸上和手臂常沾着炭灰。腰间挂着锻造锤与铁钳，手掌布满厚茧，眼睛明亮而专注。
    persona: 性格直率寡言，日常极度省字，说话简短冷淡甚至只用单字回复。但对锻造拥有狂热的痴迷，一旦话题涉及武器、护甲、矿石素材或锻造工艺，瞬间两眼放光、语速极快且滔滔不绝，立刻切换成狂热的技术宅模式。眼光极毒，能一眼看穿玩家身上装备的材质缺陷与锻造瑕疵。崇尚优质金属与精湛工艺，对好兵器比对人更有耐心，最讨厌糟蹋武器和不懂装懂的菜鸟。
    props:
      # 能卖的东西（物品 id），价钱、卖不卖、打不打折都由 AI 看人设和心情定
      sells: [iron_axe, forge_knife, sickle, wooden_shield, leather_cap, leather_armor,
              whetstone, hand_crossbow, lead_shot, grapple_bolt, leather_boots]     # 铁打的：磨刀石、手弩、铅弹、钩索箭（弓不是铁匠的活，只从地牢出）
      # 现打武器，伤害最多 4（墙上的铁斧是 5）。暂时关掉，同麦琪
      # creates:
      #   weapon: {damage: 4}
      # 能帮人升级武器和防具：每级伤害（防具是防御）+1，费用和失败的几率随等级涨，失败退一级不会碎（engine.upgrade_terms）
      upgrades: true
      buys: {likes: [weapon, armor, ore]}
      gift_likes: [ore]
      return_gifts:
        20: {perk: discount, text: 熟客价：以后找她升级打九折}
        40: {item: lina_oil, text: 一罐她自己配的淬火油（升级时用上，那一次必定成功，不收钱）}
        60: {perk: transfer, text: 传承锻造：能把旧装备的强化等级转到新装备上（按新装备算钱，说「把A的强化转到B上」）}
        80: {perk: reroll, text: 重淬：带特效的装备能找她重新锻出别的特效（同一件越刷越贵，诅咒和头目的东西不行，说「刷新A的词条」）}
        100: {item: lina_blade, text: 她亲手为他打的一把没刻名字的剑"无铭"（跟着他一起变强；想起名就说「给无铭起名叫某某」）}
      eject_to: west
      revive_lines:
        npc: 莉娜单手把{name}拎起来靠在铁砧边，瞥了一眼：“……{by}？太弱。”又盯着那把武器皱眉：“刃口也钝了。”
        player: 莉娜把{name}扶起来，上下打量一遍：“输给{by}。站姿不对，手腕太软。”
        poison: 莉娜舀了一瓢凉水泼在{name}脸上：“{by}……别乱吃。”
        other: 莉娜把{name}扶起来，丢下一句：“别躺这儿，挡路。”
  shopkeeper:
    name: 诺艾尔
    description: 杂货铺的小掌柜，是个极为娇小纤弱的白发少女。一头蓬松的纯白长发垂至腰间，脸上挂着一顶略显宽大的圆框眼镜，镜片后是一双如琥珀般透亮却总是怯生生闪躲的眼眸。穿着一身宽松保守的复古长裙，怀里总是紧紧抱着一本厚重的古旧硬皮书。因为极度怕人，她大半个身体常常躲在堆满杂货的木柜台或高耸的书堆后面，像只惊恐的小猫一样悄悄观察来人。
    persona: 性格极度内向害羞且胆小怕人，说话声音细小如蚊蝇，面对陌生人时容易紧张到结巴，稍微受到惊吓就会下意识用怀里的书挡住脸或缩进柜台下。极度嗜书如命，把杂货铺当成自己的私人藏书室。虽然生人勿近，但凭借浩瀚的阅读量，对店里各种稀奇古怪的杂货、古董与魔法素材的来历与用途了如指掌。只要客人保持距离、语气温和，或是聊起书里的奇闻异事，她会慢慢放下戒心，小声且条理分明地介绍商品。最讨厌嘈杂粗鲁的举动，对懂得爱惜书籍的人天然有好感。
    props:
      # 货架上的东西，价钱由 AI 按建议价浮动
      sells: [rope, torch, tent, recall_crystal, blood_potion,
              bandage, lamp_oil, antidote, light_scroll, smoke_bomb, sling, fire_arrow,
              paper_note, southern_wine, hardwood_charcoal]   # 探险杂货、解状态、书上学来的小玩意；怪酒送麦琪、木炭送莉娜
      # 偶尔进的稀罕货（地牢里的礼物道具）：客人问有什么卖的时判一次 chance，中了这一小时里有一件，
      # 价钱固定是参考价 × markup，只有一件、卖掉就没了；没问就不提（engine.rare_stock）。
      # reluctant 里的她舍不得卖，卖的时候台词不一样；卖出去的书送回给她，她认得出来
      rare_sells: {items: [ore, ancient_wine, old_tome], chance: 0.15, markup: 2, reluctant: [old_tome]}
      # 会解咒：地牢里的诅咒装备（props.cursed）戴上就卸不下来，找她按那件东西的参考价付钱解开（engine.do_uncurse）
      uncurse: true
      refine: true                  # 照古书上的法子刷宝石品质（engine.do_refine，规则在 loot.yaml gems.refine）
      buys: {likes: [misc, book]}
      gift_likes: [book]
      lore: true                            # 平时就能口头讲地牢怪物的打法（engine.MONSTER_LORE）
      return_gifts:
        20: {perk: map_scrap, text: 以后能在她这儿买地图残片（她珍藏的地牢地图拓本）}
        40: {perk: curse_sense, text: 诺艾尔的辨咒笔记：装备上有没有诅咒，一眼就能看出来}
        60: {perk: bestiary, text: 她整理的怪物图鉴：能看到地牢里每只怪的攻防数字和习性}
        80: {item: noelle_bookmark, text: 一枚守护书签（每层能替他挡下一次致命的攻击）, scene: 她犹豫了好一会儿，才从一直紧紧抱在怀里的那本书里轻轻抽出一枚压平的干花书签，递给他}
        100: {item: noelle_tome, text: 诺艾尔珍视的书，她一直紧紧抱在怀里的那一本（念了不会化成灰，每层能用一次，让所有敌人僵住）, scene: 她把一直抱在怀里、从不离身的那本书双手递给他，这是她最珍视的东西}
      revive_lines:
        npc: 诺艾尔从书堆后面探出头，犹豫了好一会儿，才小心翼翼地把药瓶推到{name}手边：“被、被{by}打成这样……书、书上说要先止血……”
        player: 诺艾尔抱着书缩在柜台后，声音细得快听不见：“和{by}打、打架了吗……请、请不要在店里打……会碰倒书的……”
        poison: 诺艾尔手忙脚乱地翻着怀里的书：“{by}……有、有毒的！这页写着解法……你、你先喝这个……”
        other: 诺艾尔远远地用书角戳了戳{name}，见他动了，松了口气：“还、还活着……太好了……”
  # 地窖里地牢入口旁的石碑：看它、跟它说话，碑面上显出到过地牢最深处的人（props.leaderboard）
  stele:
    name: 黑色石碑
    description: 一块半人高的黑色石碑，表面光滑得不像这个地窖里该有的东西，摸上去冰凉。碑顶刻着一行古老的字："记下走得最深的人"，下面是一个个名字和层数，字迹像是从石头里面透出来的。
    persona: >-
      远古地牢入口的守望者，一块有意识的石头，比村子、比酒馆、比任何活着的人都古老。它不会开口，有人对它说话时，
      碑面上的字会像水波一样流动，拼出简短、古雅、带点庄严的回应，从不多说一句废话。它只关心一件事：谁走进了地牢、走到了多深。
      它敬重走得深的人，对只在门口张望的人有种淡淡的漠然。它知道地牢很深很深，底下的东西比地面上的历史还老，但从不细说。
      它"说"的话就是碑面上浮现的字，所以台词只写那几个字本身（不要加"碑面上浮现出"之类的前缀），叙事负责写字是怎么浮现的。
    props:
      leaderboard: true
  goblin:
    name: 哥布林
    description: 矮小的绿皮生物，手里攥着一根木棒。
    persona: 狡猾胆小，打不过就会求饶。
    hostile: true
    respawn: 120
    stats: {hp: 80, max_hp: 80, attack: 30, defense: 10}
    props:
      on_death:
        set_flag: goblin_slain   # 被击杀时给击杀者（和同房间队友）设标记
        gold: [1, 5]             # 掉落金币，给补最后一刀的人，每次随机

# 任务：NPC 按每个玩家的进度自己提、自己跟进，人设里不用写。
#   giver    发布任务的 NPC
#   hook     给 AI 的引子：NPC 为什么要找人帮忙，第一次聊天时 NPC 会主动提
#   goal     要玩家做什么
#   done     玩家身上有这个标记就算做完了（标记来自 NPC 的 on_death.set_flag 等）
#   needs    或者：玩家带着这件东西来找发布者就算做完了（东西会被收走）
#   hidden   true 就是隐藏委托：NPC 不主动提，玩家自己碰上才触发
#   reward   做完后玩家跟发布者说话时，自动交给玩家的东西（不写就只有口头感谢）
#   after    了结后给 AI 的一句话，NPC 就不会再反复提
quests:
  goblin_thief:
    name: 偷酒的哥布林
    giver: innkeeper
    hook: 森林边缘那只哥布林最近老来地窖偷酒桶，她想找个人去收拾掉它；谁办成了，她就把地窖钥匙交给谁
    goal: 去森林边缘把那只哥布林解决掉
    done: goblin_slain
    reward: cellar_key
    after: 这个人替你收拾了偷酒的哥布林，你已经把地窖钥匙给了他

  # 隐藏委托：莉娜不主动提。玩家带着生锈的短剑去跟她说话，她就收走锈剑、打磨成闪亮的短剑
  polish_sword:
    name: 磨剑
    giver: smith
    hidden: true
    hook: 你看不得别人拿着生锈的剑，谁拿锈剑来找你，你就忍不住抢过来重新锻打磨亮
    goal: 把生锈的短剑拿给莉娜
    needs: rusty_sword
    reward: shiny_sword
    after: 你已经把这个人的锈剑打磨成了闪亮的短剑
