start_room: square

rooms:
  square:
    name: 村口广场
    description: 石板铺成的小广场，中间一口老井，四周是低矮的木屋。
    # details 只给 AI 看：不能拿、不参与规则的环境细节，玩家可以摸、敲、闻、看（freeform）
    details: >-
      老井的井沿是青灰色的石头，被磨得光滑，缝里长着青苔；井上架着木辘轳，挂着一根磨毛的麻绳和一只空木桶，
      往下看黑沉沉的，丢颗石子要过一会儿才听见水声。石板缝里嵌着干泥和几根鸡毛。
      广场边有一棵老槐树，树干上钉着一块空白的旧木牌，牌面被雨水泡得发黑，看不出原来写过什么。
      木屋都关着门，屋檐下挂着成串的干辣椒和玉米，有一户窗台上晒着一双补过的布鞋。
      北边野猪酒馆的招牌是一块刻着野猪头的木板，东边铁匠铺传来有节奏的敲打声，南边是出村的土路。
    exits:
      north: {to: tavern}
      east: {to: smithy}
      south: {to: path}
    items: [bread]

  tavern:
    name: 野猪酒馆
    description: 昏暗的酒馆，空气里混着麦酒和烤肉的味道。角落有一扇通往地窖的木门。
    details: >-
      一条长长的橡木吧台，台面上满是杯底压出的水印和刀刻的名字缩写，吧台后面的架子上摆着一排陶酒壶。
      壁炉里烧着木柴，铁叉上架着半只烤着的羊腿，油滴进火里滋滋作响。
      四五张粗木桌，长凳坐得发亮，一张桌腿下垫着折起来的皮子防晃。
      墙上挂着一个落满灰的野猪头标本，一只獠牙断了一截。
      地窖门是厚木板钉的，门上一把黑铁大锁。
      没有别的客人，只有壁炉噼啪声和老汉斯擦杯子的声音。
    exits:
      south: {to: square}
      down: {to: cellar, locked: true, key: cellar_key}
    npcs: [innkeeper]

  cellar:
    name: 酒馆地窖
    description: 潮湿阴冷，堆满了酒桶，只有楼梯口透下来一点光。
    details: >-
      酒桶沿墙码成两层，大多是满的，敲起来声音发闷；最里面几只空桶敲起来咚咚响，桶身上用粉笔写着年份。
      墙是粗石砌的，摸上去又冷又湿，渗着水珠，角落结着蛛网。
      地面是压实的泥土，有几道拖桶留下的划痕。空气里是木头、霉味和酸酒的味道。
      木楼梯吱呀作响，通回上面的酒馆。
    exits:
      up: {to: tavern}
    items: [old_amulet]

  smithy:
    name: 铁匠铺
    description: 炉火正旺，墙上挂着各式农具和几把粗糙的武器。
    details: >-
      熔炉用红砖砌成，风箱是牛皮做的，拉一下炉火就呼地一旺；屋里热得人冒汗，满是煤烟和铁锈味。
      铁砧黑亮，边上摆着大小几把锤子和长柄火钳，一桶淬火用的水表面浮着一层油光。
      墙上挂的镰刀、锄头、斧头和几把粗糙的刀都是莉娜的货，用铁钩挂得很牢，没她点头拿不下来。
      地上落着铁屑和煤渣，门口堆着一小堆等着修的破农具。
    exits:
      west: {to: square}
    items: [rusty_sword]
    npcs: [smith]

  path:
    name: 村外小路
    description: 泥土小路通向南边的森林，路边长着几丛药草。
    details: >-
      路面上有车辙和脚印，低洼处积着一滩泥水。路两边是野草和几丛开着小白花的荆棘。
      一块半埋在土里的里程石，上面刻的字已经磨平了。
      回头能看见村子的屋顶和酒馆烟囱冒出的烟，往南路越走越窄，钻进树林里。
      草丛里有虫鸣，偶尔有只麻雀从路面飞起。
    exits:
      north: {to: square}
      south: {to: forest_edge}
    items: [herb]

  forest_edge:
    name: 森林边缘
    description: 高大的树木遮住了阳光，林子里又暗又静。
    details: >-
      粗大的橡树和松树，树皮上长着苔藓和灰白色的地衣，树根盘在地面上，容易绊脚。
      地上铺着厚厚的落叶和松针，踩上去软软的，底下是湿的。
      灌木丛很密，枝条上挂着几缕被扯下的灰毛。一棵倒下的枯树横在路边，树干中间已经空了。
      远处偶尔传来鸟叫，空气里是腐叶和松脂的味道。再往南没有路了，树林密得走不进去。
    exits:
      north: {to: path}
    npcs: [goblin]

items:
  bread:
    name: 面包
    description: 有点硬的黑麦面包。
    type: consumable
    heal: 3
  herb:
    name: 药草
    description: 散发清香的绿色草叶，据说能止血。
    type: consumable
    heal: 6
  rusty_sword:
    name: 生锈的短剑
    description: 剑刃布满锈迹，但还算锋利。
    type: weapon
    damage: 4
  cellar_key:
    name: 地窖钥匙
    description: 一把沉甸甸的铁钥匙。
    type: key
  old_amulet:
    name: 古旧护符
    description: 刻着看不懂的符文，在昏暗处微微发着蓝光。
    type: armor
    defense: 2

npcs:
  innkeeper:
    name: 老汉斯
    description: 酒馆老板，胖胖的中年人，总在擦同一个杯子。
    persona: 热情但爱打听八卦，对地窖的事讳莫如深，除非客人帮他解决森林里的哥布林。
    inventory: [cellar_key]
    props:
      # 给予规则（不写就是不给）：
      #   ai                                  AI 看人设自己决定
      #   {requires: 标记, min_affinity: 数值}  两个条件可以只写一个，都写就要同时满足
      gives:
        cellar_key: {requires: goblin_slain}
  smith:
    name: 铁匠莉娜
    description: 手臂粗壮的女铁匠，说话简短。
    persona: 话少，不耐烦，但对真心想学打铁的人很友善。
  goblin:
    name: 哥布林
    description: 矮小的绿皮生物，手里攥着一根木棒。
    persona: 狡猾胆小，打不过就会求饶。
    hostile: true
    stats: {hp: 8, max_hp: 8, attack: 3, defense: 1}
    props:
      on_death: {set_flag: goblin_slain}   # 被击杀时给击杀者设标记
